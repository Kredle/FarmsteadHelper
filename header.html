<header>
    <style>
        /* Основні стилі для хедера */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            background-color: #333;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .logo {
            display: flex;
            align-items: center;
        }

        .logo img {
            height: 60px;
            margin-right: 10px;
        }

        .logo span {
            font-size: 20px;
            font-weight: bold;
            color: #fff; /* Білий текст */
        }

        nav {
            display: flex;
            gap: 20px;
        }

        nav a {
            text-decoration: none;
            color: #fff; /* Білий текст */
            font-size: 16px;
            padding: 5px 10px;
            transition: background-color 0.3s, color 0.3s;
        }

        nav a:hover {
            background-color: #444;
            border-radius: 5px;
        }

        .auth {
            position: relative;
        }

        .auth img {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            cursor: pointer;
            filter: invert(1); /* Інверсія кольорів іконки входу */
        }

        .auth-menu {
            display: none;
            position: absolute;
            top: 50px;
            right: 0;
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            z-index: 1000;
        }

        .auth-menu a {
            display: block;
            padding: 10px;
            text-decoration: none;
            color: #333;
            font-size: 14px;
        }

        .auth-menu a:hover {
            background-color: #f4f4f4;
        }

        .auth:hover .auth-menu {
            display: block;
        }
    </style>

    <div class="logo">
        <img src="logo.png" alt="FarmsteadHelper Logo">
        <span>FarmsteadHelper</span>
    </div>
    <nav>
        <a href="/">Головна</a>
        <a href="/catalog">Каталог</a>
        <a href="/forum">Форум</a>
        <a href="/map">Інтерактивна мапа</a>
        <a href="/calendar">Календар</a>
    </nav>
    <div class="auth">
        <!-- Зображення авторизації -->
        <img src="loginlogo.png" alt="Auth Icon" id="auth-icon">
        <div class="auth-menu">
            <a href="login_page.html">Вхід</a>
            <a href="registration_form.html">Реєстрація</a>
        </div>
    </div>
</header>
