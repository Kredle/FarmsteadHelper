<!DOCTYPE html>
<html lang="uk">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форум</title>
    <link rel="stylesheet" type="text/css" href="{% static 'api/stylespages.css' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'api/mainstyles.css' %}">
    <!--<script defer src="script.js"></script>-->
</head>
<body>
    <!-- Хедер -->
    <header>
    <div class="logo">
        <img src="{% static 'logo.png' %}" alt="FarmsteadHelper Logo">
        <span>FarmsteadHelper</span>
    </div>
    <div class="hamburger" id="hamburger">
        <div></div>
        <div></div>
        <div></div>
    </div>
    <div class="side-menu" id="side-menu">
        <div class="side-menu-close">
            <button id="close-menu">&times;</button>
        </div>
        <a href="/">Головна</a>
        <a href="/catalog">Каталог</a>
        <a href="/forum">Форум</a>
        <a href="/map">Інтерактивна мапа</a>
        <a href="/calendar">Календар</a>
        <div class="auth-buttons" id="side-menu-auth">
            <a href="/login">Вхід</a>
            <a href="/register">Реєстрація</a>
        </div>
    </div>
    <nav>
        <a href="/">Головна</a>
        <a href="/catalog">Каталог</a>
        <a href="/forum">Форум</a>
        <a href="/map">Інтерактивна мапа</a>
        <a href="/calendar">Календар</a>
    </nav>
    <div class="auth">
        <img src="{% static 'loginlogo.png' %}" alt="Auth Icon" id="auth-icon">
        <div class="auth-menu">
            <a href="/login">Вхід</a>
            <a href="/register">Реєстрація</a>
        </div>
    </div>
    
    
    <script>

    var isAuthenticated = "{{ user.is_authenticated|yesno:'true,false' }}";
    
    document.addEventListener('DOMContentLoaded', () => {
        const token = localStorage.getItem('authToken');
        const authContainer = document.querySelector('.auth');
        const sideMenuAuth = document.getElementById('side-menu-auth');
    
        if (token) {
            fetch('/api/user-data/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ token: token }),
            })
                .then(response => {
                    if (!response.ok) {
                        return response.json().then(err => {
                            throw new Error(`Помилка: ${err.detail || 'Невідома помилка'}`);
                        });
                    }
                    return response.json();
                })
                .then(data => {
                    const avatarUrl = data.avatarUrl ? decodeURIComponent(data.avatarUrl) : "{% static 'defaultlogo.png' %}";
                    authContainer.innerHTML = `
                        <img src="${avatarUrl}" alt="Avatar" class="user-avatar">
                        <div class="auth-menu">
                            <span>${data.username}</span>
                            <a href="/profile/${data.username}">Профіль</a>
                            <a href="/edit-profile/">Налаштування профілю</a>
                            <a href="#" id="logout-btn">Вихід</a>
                        </div>
                    `;
    
                    sideMenuAuth.innerHTML = `
                        <a href="/profile/${data.username}">Профіль</a>
                        <a href="/edit-profile">Налаштування профілю</a>
                        <a href="#" id="side-menu-logout">Вихід</a>
                    `;
    
                    document.getElementById('logout-btn').addEventListener('click', () => {
                        handleLogout();
                    });
    
                    document.getElementById('side-menu-logout').addEventListener('click', () => {
                        handleLogout();
                    });
                })
                .catch(error => {
                    console.error('Помилка при отриманні даних користувача:', error);
                    resetAuthState();
                });
        } else {
            resetAuthState();
        }
    
        function handleLogout() {
            fetch('/api/logout/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ token: token }),
            })
                .then(response => {
                    if (response.ok) {
                        localStorage.removeItem('authToken');
                        window.location.href = '/';
                    } else {
                        return response.json().then(err => {
                            throw new Error(`Помилка: ${err.detail || 'Невідома помилка'}`);
                        });
                    }
                })
                .catch(error => console.error('Помилка при виході:', error));
        }
    
        function resetAuthState() {
            authContainer.innerHTML = `
                <img src="{% static 'loginlogo.png' %}" alt="Auth Icon" id="auth-icon">
                <div class="auth-menu">
                    <a href="/login">Вхід</a>
                    <a href="/register">Реєстрація</a>
                </div>
            `;
    
            sideMenuAuth.innerHTML = `
                <a href="/login">Вхід</a>
                <a href="/register">Реєстрація</a>
            `;
        }
    });
    
    const hamburger = document.getElementById('hamburger');
    const sideMenu = document.getElementById('side-menu');
    const closeMenu = document.getElementById('close-menu');
    const nav = document.querySelector('nav');
    const auth = document.querySelector('.auth');
    
    hamburger.addEventListener('click', () => {
        sideMenu.style.right = '0';
    });
    
    closeMenu.addEventListener('click', () => {
        sideMenu.style.right = '-250px';
    });
    
    function checkMenuVisibility() {
        const isMobileDevice = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    
        if (window.innerWidth < 900 || isMobileDevice) {
            nav.style.display = 'none';
            auth.style.display = 'none';
            hamburger.style.display = 'flex';
        } else {
            nav.style.display = 'flex';
            auth.style.display = 'block';
            hamburger.style.display = 'none';
        }
    }
    
    checkMenuVisibility();
    window.addEventListener('resize', checkMenuVisibility);
    </script>
    </header>
    <header>
        <h1>Форум</h1>
        <div class="search-panel">
            <input type="text" id="search" placeholder="Пошук за ключовими словами...">
            <div class="filter-dropdown">
                <button id="filter-toggle-btn">Фільтри</button>
                <div id="filter-options" class="filter-options hidden">
                    <label>
                        <input type="checkbox" value="Дерева"> Дерева
                    </label>
                    <label>
                        <input type="checkbox" value="Овочі"> Овочі
                    </label>
                    <label>
                        <input type="checkbox" value="Квіти"> Квіти
                    </label>
                    <label>
                        <input type="checkbox" value="Тварини"> Тварини
                    </label>
                </div>
            </div>                      
            <button id="search-btn">Шукати</button>
        </div>
        <button id="create-topic-btn">+ Створити тему</button>
    </header>

    <main>
        <section class="discussions">
            <h2>Популярні теми</h2>
            <div id="discussion-list-popular"></div>
        </section>

        <section class="discussions">
            <h2>Обговорення</h2>
            <div id="discussion-list"></div>
            <button id="load-more-btn" class="hidden">Завантажити ще</button>
        </section>     
    </main>
    <script>
    document.addEventListener('DOMContentLoaded', () => {
    const categories = {
        "Дерева": "/static/images/tree.jpg",
        "Овочі": "/static/images/vegetables.png",
        "Квіти": "/static/images/flowers.jpg",
        "Тварини": "/static/images/animals.jpg"
    };

    const discussionList = document.getElementById('discussion-list');
    const filterToggleBtn = document.getElementById('filter-toggle-btn');
    const filterOptions = document.getElementById('filter-options');
    const searchBtn = document.getElementById('search-btn');
    const searchInput = document.getElementById('search');
    const loadMoreBtn = document.getElementById('load-more-btn');
    const discussionsPerLoad = 3;
    // Показати/сховати випадаючий список із фільтрами
    filterToggleBtn.addEventListener('click', () => {
        filterOptions.classList.toggle('visible');
    });

    // Закрити випадаючий список при натисканні поза ним
    document.addEventListener('click', (event) => {
        if (!filterToggleBtn.contains(event.target) && !filterOptions.contains(event.target)) {
            filterOptions.classList.remove('visible');
        }
    });

    // Функція для отримання вибраних категорій
    function getSelectedCategories() {
        const checkboxes = filterOptions.querySelectorAll('input[type="checkbox"]:checked');
        return Array.from(checkboxes).map(checkbox => checkbox.value);
    }

    // Функція для обрізки тексту до певної кількості слів
    function truncateText(text, wordLimit) {
        const words = text.split(' ');
        if (words.length <= wordLimit) {
            return text;
        }
        return words.slice(0, wordLimit).join(' ') + '...';
    }

    // Функція для завантаження обговорень
    // Функція для завантаження даних через fetch
    function fetchDiscussions() {
        return fetch('/forum/get_topics') // Шлях до вашого API
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }
                return response.json(); // Парсимо JSON-відповідь
            })
            .catch(error => {
                console.error('Error fetching discussions:', error); // Обробка помилок
                return []; // Повертаємо порожній масив у разі помилки
            });
    }
    function fetchPopularDiscussions() {
        return fetch('/forum/get_popular_topics') // Шлях до вашого API
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }
                return response.json(); // Парсимо JSON-відповідь
            })
            .catch(error => {
                console.error('Error fetching discussions:', error); // Обробка помилок
                return []; // Повертаємо порожній масив у разі помилки
            });
    }
    // Функція для відображення популярних тем
    function loadPopularDiscussions(discussions) {
        console.log(discussions); // Лог для перевірки масиву дискусій

        const discussionList = document.querySelector('#discussion-list-popular'); // Ваш контейнер для обговорень
        if (!discussionList) {
            console.error("Container for discussions not found");
            return;
        }

        // Очищуємо контейнер перед додаванням нових елементів
        //discussionList.innerHTML = '';

        // Ініціалізуємо фрагмент
        const fragment = document.createDocumentFragment();

        discussions.forEach(topic => {
            const content = topic.Content || 'Немає опису';
            const truncatedContent = truncateText(content, 30); // Функція для скорочення тексту
            const discussionDiv = document.createElement('div');
            discussionDiv.classList.add('discussion');
            discussionDiv.innerHTML = `
                <div class="discussion-header">
                    <img src="${categories[topic.Category] || '/images/default.png'}" alt="${topic.Category}" class="category-img">
                    <div>
                        <h3><a href="/forum/topic/${topic.idTopic}/">${topic.Title}</a></h3>
                        <p>Категорія: ${topic.Category}</p>
                        <p>Автор: ${topic.Author} | Дата: ${topic.Date}</p>
                    </div>
                </div>
                <p>${truncatedContent}</p>
                <p>Лайки: ${topic.Likes || 0} | Коментарі: ${topic.Comments || 0}</p>
            `;
            fragment.appendChild(discussionDiv);
        });

        // Додаємо елементи в контейнер
        discussionList.appendChild(fragment);
    }
    fetchPopularDiscussions().then(discussions => {
        loadPopularDiscussions(discussions);
    });
    // Функція для відображення дискусій
    function loadDiscussions(discussions) {
        console.log(discussions); // Лог для перевірки масиву дискусій

        const discussionList = document.querySelector('#discussion-list'); // Ваш контейнер для обговорень
        if (!discussionList) {
            console.error("Container for discussions not found");
            return;
        }

        // Очищуємо контейнер перед додаванням нових елементів
        //discussionList.innerHTML = '';

        // Ініціалізуємо фрагмент
        const fragment = document.createDocumentFragment();

        discussions.forEach(topic => {
            const content = topic.Content || 'Немає опису';
            const truncatedContent = truncateText(content, 30); // Функція для скорочення тексту
            const discussionDiv = document.createElement('div');
            discussionDiv.classList.add('discussion');
            discussionDiv.innerHTML = `
                <div class="discussion-header">
                    <img src="${categories[topic.Category] || '/images/default.png'}" alt="${topic.Category}" class="category-img">
                    <div>
                        <h3><a href="/forum/topic/${topic.idTopic}/">${topic.Title}</a></h3>
                        <p>Категорія: ${topic.Category}</p>
                        <p>Автор: ${topic.Author} | Дата: ${topic.Date}</p>
                    </div>
                </div>
                <p>${truncatedContent}</p>
                <p>Лайки: ${topic.Likes || 0} | Коментарі: ${topic.Comments || 0}</p>
            `;
            fragment.appendChild(discussionDiv);
        });

        // Додаємо елементи в контейнер
        discussionList.appendChild(fragment);
    }

    // Використання
    fetchDiscussions().then(discussions => {
        loadDiscussions(discussions);
    });

    // Завантаження обговорень з кнопкою "Завантажити ще"
    let currentIndex = 0; // Ініціалізуємо індекс
    let filteredDiscussions = []; // Глобальна змінна для фільтрованих тем
    // Функція для завантаження більше обговорень
    function loadMoreDiscussions() {
        // Завантажуємо наступну порцію тем
        console.log(currentIndex);
        const discussionsToLoad = filteredDiscussions.slice(currentIndex, currentIndex + discussionsPerLoad);
        loadDiscussions(discussionsToLoad);

        // Оновлюємо індекс
        currentIndex += discussionsPerLoad;

        // Якщо всі обговорення завантажено, ховаємо кнопку
        if (currentIndex >= filteredDiscussions.length) {
            loadMoreBtn.classList.add('hidden');
        }
    }

    // Функція для об'єднаної фільтрації
        function filterDiscussions() {
            const searchTerm = searchInput.value.toLowerCase(); // Отримуємо значення пошуку
            const selectedCategories = getSelectedCategories(); // Отримуємо вибрані категорії

            fetch('/forum/get_topics') // Запит до вашого API
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! Status: ${response.status}`);
                    }
                    return response.json(); // Парсимо JSON-відповідь
                })
                .then(topics => {
                    // Фільтруємо отримані теми
                    let filteredDiscussionsTemp;
                    
                    // Якщо searchTerm порожній, не фільтруємо за ним
                    if (searchTerm === '') {
                        filteredDiscussionsTemp = topics; // Якщо пошуковий запит порожній, беремо всі теми
                    } else {
                        // Фільтруємо отримані теми за категорією та пошуковим запитом
                        filteredDiscussionsTemp = topics.filter(topic => {
                            const matchesCategory = selectedCategories.length === 0 || selectedCategories.includes(topic.Category);
                            const matchesSearch = topic.Title.toLowerCase().includes(searchTerm) || topic.Content.toLowerCase().includes(searchTerm);
                            return matchesCategory && matchesSearch;
                        });
                    }

                    // Оновлюємо глобальний масив
                    filteredDiscussions = filteredDiscussionsTemp;
                    // Очищаємо список обговорень перед оновленням
                    discussionList.innerHTML = '';
                    currentIndex = 0; // Скидаємо індекс для завантаження

                    // Завантажуємо перші обговорення
                    loadDiscussions(filteredDiscussions.slice(0, discussionsPerLoad));
                    currentIndex = discussionsPerLoad;

                    // Якщо є більше тем для завантаження, показуємо кнопку "Завантажити ще"
                    if (filteredDiscussions.length > discussionsPerLoad) {
                        loadMoreBtn.classList.remove('hidden');
                    } else {
                        loadMoreBtn.classList.add('hidden');
                    }
                })
                .catch(error => {
                    console.error("Error fetching topics:", error);
                });
        }

    // Обробники для фільтрації та кнопки "Завантажити ще"
    filterOptions.addEventListener('change', filterDiscussions);
    searchBtn.addEventListener('click', filterDiscussions);
    loadMoreBtn.addEventListener('click', loadMoreDiscussions);

    // Початкове завантаження перших трьох обговорень
    loadMoreDiscussions();
    });
    document.getElementById('create-topic-btn').addEventListener('click', () => {
            window.location.href = 'create-discussion';
    });
    </script>        
</body>
</html>
