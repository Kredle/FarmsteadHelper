{% extends "base.html" %}
{% load static %}

{% block title %}Форум{% endblock %}

{% block extra_head %}
    <link rel="stylesheet" type="text/css" href="{% static 'api/stylespages.css' %}">
{% endblock %}

{% block header_bottom %}
    <!-- Специфічна панель пошуку тільки для форуму -->
    <div class="line_bottom">
        <h1>Форум</h1>
        <div class="search-panel">
            <input type="text" id="search" placeholder="Пошук...">
                <div class="filter-dropdown">
                    <button id="filter-toggle-btn">Фільтри</button>
                    <div id="filter-options" class="filter-options hidden">
                        <label>
                            <input type="checkbox" value="Дерева"> Дерева
                        </label>
                        <label>
                            <input type="checkbox" value="Овочі"> Овочі
                        </label>
                        <label>
                            <input type="checkbox" value="Квіти"> Квіти
                        </label>
                        <label>
                            <input type="checkbox" value="Тварини"> Тварини
                        </label>
                    </div>
                </div>                      
                <button id="search-btn">Шукати</button>
            </div>
            <button id="create-topic-btn">+ Створити тему</button>
        </div>
{% endblock %}

{% block content %}
<!--<div class="page_container">-->
    <main>
        <section class="discussions">
            <h2>Обговорення</h2>
            <div id="discussion-list"></div>
            <button id="load-more-btn" class="hidden">Завантажити ще</button>
        </section>     
    </main>
{% endblock %}
{% block extra_scripts %}
    <script>
    const CATEGORIES_CONFIG = {
        "Дерева": "/static/images/tree.jpg",
        "Овочі": "/static/images/vegetables.png",
        "Квіти": "/static/images/flowers.jpg",
        "Тварини": "https://farmsteadhelper.pythonanywhere.com/media/avatars/2/animals_1eF6m4f.jpg"
    };

    // Глобальний стан
    let allFilteredTopics = []; 
    let currentIndex = 0;
    let confirmedSearchTerm = ''; // Сюди потрапляє текст тільки після Enter або кліку
    const discussionsPerLoad = 3;

    function truncateText(text, wordLimit) {
        if (!text) return 'Немає опису';
        const words = text.split(' ');
        return words.length <= wordLimit ? text : words.slice(0, wordLimit).join(' ') + '...';
    }

    // Отримує фільтри, використовуючи ПІДТВЕРДЖЕНЕ слово пошуку
    function getCurrentFilters() {
        const filterOptions = document.getElementById('filter-options');
        const selectedCategories = filterOptions ? Array.from(filterOptions.querySelectorAll('input[type="checkbox"]:checked')).map(cb => cb.value) : [];
        return {
            searchTerm: confirmedSearchTerm, 
            categories: selectedCategories
        };
    }

    function renderSingleTopic(topic, prepend = false) {
        const discussionList = document.getElementById('discussion-list');
        if (!discussionList || document.querySelector(`.discussion[data-id="${topic.idTopic}"]`)) return;

        const discussionDiv = document.createElement('div');
        discussionDiv.classList.add('discussion');
        discussionDiv.setAttribute('data-id', topic.idTopic);
        
        if (prepend) {
            discussionDiv.style.borderLeft = "5px solid #4CAF50";
            discussionDiv.style.backgroundColor = "#f1f8e9";
        }

        discussionDiv.innerHTML = `
            <div class="discussion-header">
                <img src="${CATEGORIES_CONFIG[topic.Category] || '/static/images/default.png'}" alt="${topic.Category}" class="category-img">
                <div>
                    <h3><a href="/forum/topic/${topic.idTopic}/">${topic.Title}</a></h3>
                    <p>Категорія: ${topic.Category}</p>
                    <p>Автор: ${topic.Author} | Дата: ${topic.Date} | Час: ${topic.Time}</p>
                </div>
            </div>
            <p>${truncateText(topic.Content, 30)}</p>
            <p class="topic-stats-row">Лайки: ${topic.Likes || 0} | Коментарі: ${topic.Comments || 0}</p>
        `;

        prepend ? discussionList.prepend(discussionDiv) : discussionList.appendChild(discussionDiv);
        
        if (prepend) {
            setTimeout(() => { 
                discussionDiv.style.backgroundColor = ''; 
                discussionDiv.style.borderLeft = ''; 
            }, 5000);
        }
    }

    async function startTopicsPolling() {
        setInterval(async () => {
            try {
                const response = await fetch('/forum/get_topics');
                if (!response.ok) return;
                const serverTopics = await response.json();
                const topics = Array.isArray(serverTopics) ? serverTopics : (serverTopics.topics || []);
                
                const { searchTerm, categories } = getCurrentFilters();
                const currentIds = allFilteredTopics.map(t => String(t.idTopic));

                topics.forEach(topic => {
                    const isKnown = currentIds.includes(String(topic.idTopic));
                    const matchesFilter = (categories.length === 0 || categories.includes(topic.Category)) &&
                                        (searchTerm === '' || topic.Title.toLowerCase().includes(searchTerm) || topic.Content.toLowerCase().includes(searchTerm));

                    if (!isKnown && matchesFilter) {
                        // Це абсолютно нова тема, якої не було при завантаженні сторінки
                        allFilteredTopics.unshift(topic);
                        currentIndex++;
                        renderSingleTopic(topic, true);
                    } else if (isKnown) {
                        // Оновлюємо статситику для тих, що вже на екрані
                        const div = document.querySelector(`.discussion[data-id="${topic.idTopic}"]`);
                        if (div) {
                            const stats = div.querySelector('.topic-stats-row');
                            if (stats) stats.textContent = `Лайки: ${topic.Likes || 0} | Коментарі: ${topic.Comments || 0}`;
                        }
                    }
                });
            } catch (e) { console.error("Polling error", e); }
        }, 10000);
    }

    async function loadData() {
        const loadMoreBtn = document.getElementById('load-more-btn');
        const discussionList = document.getElementById('discussion-list');
        const { searchTerm, categories } = getCurrentFilters();

        try {
            const [popRes, allRes] = await Promise.all([
                fetch('/forum/get_popular_topics'),
                fetch('/forum/get_topics')
            ]);
            
            const popData = await popRes.json();
            const allData = await allRes.json();
            
            const popular = popData.topics || [];
            const normal = Array.isArray(allData) ? allData : (allData.topics || []);

            // Формуємо чергу: популярні спочатку, потім решта без дублів
            let combined = [...popular];
            normal.forEach(t => {
                if (!combined.find(p => p.idTopic === t.idTopic)) combined.push(t);
            });

            // Фільтруємо згідно з ПІДТВЕРДЖЕНИМИ параметрами
            allFilteredTopics = combined.filter(topic => {
                const matchesCategory = categories.length === 0 || categories.includes(topic.Category);
                const matchesSearch = searchTerm === '' || 
                                     topic.Title.toLowerCase().includes(searchTerm) || 
                                     topic.Content.toLowerCase().includes(searchTerm);
                return matchesCategory && matchesSearch;
            });

            if (discussionList) discussionList.innerHTML = '';
            currentIndex = 0;
            
            const initialBatch = allFilteredTopics.slice(0, discussionsPerLoad);
            initialBatch.forEach(t => renderSingleTopic(t));
            currentIndex = initialBatch.length;

            if (loadMoreBtn) {
                allFilteredTopics.length > currentIndex ? loadMoreBtn.classList.remove('hidden') : loadMoreBtn.classList.add('hidden');
            }
        } catch (e) { console.error("Load error", e); }
    }

    document.addEventListener('DOMContentLoaded', () => {
        const searchInput = document.getElementById('search');
        const searchBtn = document.getElementById('search-btn');
        const filterToggleBtn = document.getElementById('filter-toggle-btn');
        const filterOptions = document.getElementById('filter-options');
        const loadMoreBtn = document.getElementById('load-more-btn');

        // Функція підтвердження пошуку
        function triggerSearch() {
            if (searchInput) confirmedSearchTerm = searchInput.value.toLowerCase();
            loadData();
        }

        // Початкове завантаження
        loadData();
        startTopicsPolling();

        // Пошук по кнопці
        if (searchBtn) searchBtn.addEventListener('click', triggerSearch);

        // Пошук по Enter
        if (searchInput) {
            searchInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    triggerSearch();
                }
            });
        }

        // Фільтри категорій
        if (filterToggleBtn) filterToggleBtn.addEventListener('click', () => filterOptions.classList.toggle('visible'));
        if (filterOptions) filterOptions.addEventListener('change', loadData);
        
        // Кнопка пагінації
        if (loadMoreBtn) {
            loadMoreBtn.addEventListener('click', () => {
                const nextBatch = allFilteredTopics.slice(currentIndex, currentIndex + discussionsPerLoad);
                nextBatch.forEach(t => renderSingleTopic(t));
                currentIndex += nextBatch.length;
                if (currentIndex >= allFilteredTopics.length) loadMoreBtn.classList.add('hidden');
            });
        }
    });

    const createBtn = document.getElementById('create-topic-btn');
    if (createBtn) createBtn.addEventListener('click', () => { window.location.href = 'create-discussion'; });
    </script>
{% endblock %}
