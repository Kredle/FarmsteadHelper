<!DOCTYPE html>
<html lang="uk">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форум</title>
    <link rel="stylesheet" href="{% static 'styles.css' %}">
    <script defer src="script.js"></script>
</head>
<body>
 

    
    <!-- Хедер -->
    <header>
        <style>
            body {
                margin: 0;
                font-family: Arial, sans-serif;
            }
    
            header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 10px 20px;
                background-color: #333;
                box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
                position: fixed;
                z-index: 1000; /* Забезпечує верхній шар */
                box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1); /* Тінь для краси */
                top: 0;
                left: 0;
                width: 98%;
            }
    
            .logo {
                display: flex;
                align-items: center;
            }
    
            .logo img {
                height: 60px;
                margin-right: 10px;
            }
    
            .logo span {
                font-size: 20px;
                font-weight: bold;
                color: #fff;
            }
    
            nav {
                display: flex;
                gap: 20px;
            }
    
            nav a {
                text-decoration: none;
                color: #fff;
                font-size: 16px;
                padding: 5px 10px;
                transition: background-color 0.3s, color 0.3s;
            }
    
            nav a:hover {
                background-color: #444;
                border-radius: 5px;
            }
    
            .auth {
                position: relative;
            }
    
            .auth img {
                width: 70px;
                height: 70px;
                border-radius: 50%;
                cursor: pointer;
            }
    
            .auth-menu {
                display: none;
                position: absolute;
                top: 50px;
                right: 0;
                background-color: #fff;
                border: 1px solid #ddd;
                border-radius: 5px;
                box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
                z-index: 1000;
            }
    
            .auth-menu a {
                display: block;
                padding: 10px;
                text-decoration: none;
                color: #333;
                font-size: 14px;
            }
    
            .auth-menu a:hover {
                background-color: #f4f4f4;
            }
    
            .auth:hover .auth-menu {
                display: block;
            }
    
            .hamburger {
                display: none;
                flex-direction: column;
                cursor: pointer;
            }
    
            .hamburger div {
                width: 25px;
                height: 3px;
                background-color: #fff;
                margin: 4px 0;
            }
    
            .side-menu {
                position: fixed;
                top: 0;
                right: -250px;
                width: 250px;
                height: 100%;
                background-color: #333;
                box-shadow: -2px 0 5px rgba(0, 0, 0, 0.2);
                transition: right 0.3s ease;
                display: flex;
                flex-direction: column;
                padding-top: 20px;
                z-index: 1000;
                overflow-y: auto; /* Додає вертикальну прокрутку */
                overflow-x: hidden; /* Забороняє горизонтальну прокрутку */
                scrollbar-width: thin; /* Тонкий скролбар для браузерів, які підтримують */
                scrollbar-color: #555 #333; /* Колір скролбару */
            }
    
            .side-menu a {
                text-decoration: none;
                color: #fff;
                font-size: 18px;
                padding: 15px 20px;
                transition: background-color 0.3s;
            }
    
            .side-menu a:hover {
                background-color: #444;
            }
    
            .side-menu-close {
                text-align: right;
                padding: 10px;
            }
    
            .side-menu-close button {
                background: none;
                border: none;
                color: #fff;
                font-size: 20px;
                cursor: pointer;
            }
    
            .side-menu .auth-buttons {
                margin-top: auto;
                padding: 20px;
            }
    
            .side-menu .auth-buttons a {
                display: block;
                text-align: center;
                padding: 10px;
                background-color: #444;
                color: #fff;
                border-radius: 5px;
                margin-bottom: 10px;
                text-decoration: none;
            }
    
            .side-menu .auth-buttons a:hover {
                background-color: #555;
            }
    
            @media (max-width: 768px) {
                nav,
                .auth {
                    display: none;
                }
    
                .hamburger {
                    display: flex;
                    margin-left: auto;
                }
            }
        </style>
    
    <div class="logo">
        <img src="{% static 'logo.png' %}" alt="FarmsteadHelper Logo">
        <span>FarmsteadHelper</span>
    </div>
    <div class="hamburger" id="hamburger">
        <div></div>
        <div></div>
        <div></div>
    </div>
    <div class="side-menu" id="side-menu">
        <div class="side-menu-close">
            <button id="close-menu">&times;</button>
        </div>
        <a href="/">Головна</a>
        <a href="/catalog">Каталог</a>
        <a href="/forum">Форум</a>
        <a href="/map">Інтерактивна мапа</a>
        <a href="/calendar">Календар</a>
        <div class="auth-buttons" id="side-menu-auth">
            <a href="/login">Вхід</a>
            <a href="/register">Реєстрація</a>
        </div>
    </div>
    <nav>
        <a href="/">Головна</a>
        <a href="/catalog">Каталог</a>
        <a href="/forum">Форум</a>
        <a href="/map">Інтерактивна мапа</a>
        <a href="/calendar">Календар</a>
    </nav>
    <div class="auth">
        <img src="{% static 'loginlogo.png' %}" alt="Auth Icon" id="auth-icon">
        <div class="auth-menu">
            <a href="/login">Вхід</a>
            <a href="/register">Реєстрація</a>
        </div>
    </div>
    
    
    <script>

    var isAuthenticated = "{{ user.is_authenticated|yesno:'true,false' }}";
    
    document.addEventListener('DOMContentLoaded', () => {
        const token = localStorage.getItem('authToken');
        const authContainer = document.querySelector('.auth');
        const sideMenuAuth = document.getElementById('side-menu-auth');
    
        if (token) {
            fetch('/api/user-data/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ token: token }),
            })
                .then(response => {
                    if (!response.ok) {
                        return response.json().then(err => {
                            throw new Error(`Помилка: ${err.detail || 'Невідома помилка'}`);
                        });
                    }
                    return response.json();
                })
                .then(data => {
                    const avatarUrl = data.avatarUrl ? decodeURIComponent(data.avatarUrl) : "{% static 'defaultlogo.png' %}";
                    authContainer.innerHTML = `
                        <img src="${avatarUrl}" alt="Avatar" class="user-avatar">
                        <div class="auth-menu">
                            <span>${data.username}</span>
                            <a href="/profile/${data.username}">Профіль</a>
                            <a href="/edit-profile/">Налаштування профілю</a>
                            <a href="#" id="logout-btn">Вихід</a>
                        </div>
                    `;
    
                    sideMenuAuth.innerHTML = `
                        <a href="/profile/${data.username}">Профіль</a>
                        <a href="/edit-profile">Налаштування профілю</a>
                        <a href="#" id="side-menu-logout">Вихід</a>
                    `;
    
                    document.getElementById('logout-btn').addEventListener('click', () => {
                        handleLogout();
                    });
    
                    document.getElementById('side-menu-logout').addEventListener('click', () => {
                        handleLogout();
                    });
                })
                .catch(error => {
                    console.error('Помилка при отриманні даних користувача:', error);
                    resetAuthState();
                });
        } else {
            resetAuthState();
        }
    
        function handleLogout() {
            fetch('/api/logout/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ token: token }),
            })
                .then(response => {
                    if (response.ok) {
                        localStorage.removeItem('authToken');
                        window.location.href = '/';
                    } else {
                        return response.json().then(err => {
                            throw new Error(`Помилка: ${err.detail || 'Невідома помилка'}`);
                        });
                    }
                })
                .catch(error => console.error('Помилка при виході:', error));
        }
    
        function resetAuthState() {
            authContainer.innerHTML = `
                <img src="{% static 'loginlogo.png' %}" alt="Auth Icon" id="auth-icon">
                <div class="auth-menu">
                    <a href="/login">Вхід</a>
                    <a href="/register">Реєстрація</a>
                </div>
            `;
    
            sideMenuAuth.innerHTML = `
                <a href="/login">Вхід</a>
                <a href="/register">Реєстрація</a>
            `;
        }
    });
    
    const hamburger = document.getElementById('hamburger');
    const sideMenu = document.getElementById('side-menu');
    const closeMenu = document.getElementById('close-menu');
    const nav = document.querySelector('nav');
    const auth = document.querySelector('.auth');
    
    hamburger.addEventListener('click', () => {
        sideMenu.style.right = '0';
    });
    
    closeMenu.addEventListener('click', () => {
        sideMenu.style.right = '-250px';
    });
    
    function checkMenuVisibility() {
        const isMobileDevice = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    
        if (window.innerWidth < 900 || isMobileDevice) {
            nav.style.display = 'none';
            auth.style.display = 'none';
            hamburger.style.display = 'flex';
        } else {
            nav.style.display = 'flex';
            auth.style.display = 'block';
            hamburger.style.display = 'none';
        }
    }
    
    checkMenuVisibility();
    window.addEventListener('resize', checkMenuVisibility);
    </script>
    </header>
    <main>
        <section class="popular-topics">
            <h2>Популярні теми</h2>
            <ul id="popular-topics-list">
                <!-- Динамічне завантаження популярних тем -->
            </ul>
        </section>

        <section class="discussions">
            <h2>Обговорення</h2>
            <div id="discussion-list">
                <!-- Обговорення будуть завантажуватися динамічно -->
            </div>
            <button id="load-more-btn" class="hidden">Завантажити ще</button>
        </section>        
    </main>

    <script>
     document.addEventListener('DOMContentLoaded', () => {
    const categories = {
        "Дерева": "/static/images/tree.jpg",
        "Овочі": "/static/images/vegetables.png",
        "Квіти": "/static/images/flowers.jpg",
        "Тварини": "/static/images/animals.jpg"
    };

    const discussions = [
        { title: 'Як доглядати за дубом?', author: 'Іван', date: '2024-12-30', content: 'Дуб - одне з найміцніших дерев, але потребує правильного догляду...', likes: 15, comments: 5, category: 'Дерева' },
        { title: 'Секрети вирощування помідорів', author: 'Марія', date: '2024-12-29', content: 'Хочу поділитися досвідом вирощування помідорів без хімії...', likes: 20, comments: 8, category: 'Овочі' },
        { title: 'Кращі способи прикрасити сад квітами', author: 'Олена', date: '2024-12-28', content: 'Чи знаєте ви, що троянди чудово поєднуються з лавандою?', likes: 12, comments: 3, category: 'Квіти' },
        { title: 'Як доглядати за собаками?', author: 'Андрій', date: '2024-12-27', content: 'Собаки потребують регулярного вигулу та збалансованого харчування...', likes: 10, comments: 4, category: 'Тварини' },
        { title: 'Чи варто вирощувати картоплю?', author: 'Оксана', date: '2024-12-26', content: 'Картопля - це один з основних продуктів, але догляд за нею може бути складним...', likes: 8, comments: 2, category: 'Овочі' },
        { title: 'Які дерева краще садити в місті?', author: 'Петро', date: '2024-12-25', content: 'У місті важливо садити дерева, які очищають повітря...', likes: 13, comments: 5, category: 'Дерева' },
        { title: 'Секрети вирощування троянд', author: 'Анна', date: '2024-12-24', content: 'Троянди потребують постійного догляду та підживлення...', likes: 15, comments: 6, category: 'Квіти' },
        { title: 'Кращі породи котів для будинку', author: 'Олег', date: '2024-12-23', content: 'Коти - чудові домашні улюбленці, але варто вибирати породи відповідно до умов проживання...', likes: 10, comments: 3, category: 'Тварини' },
        { title: 'Як вирощувати огірки на балконі?', author: 'Лариса', date: '2024-12-22', content: 'Огірки можна вирощувати навіть на балконі за допомогою спеціальних контейнерів...', likes: 18, comments: 7, category: 'Овочі' },
        { title: 'Чи можна садити ялинки вдома?', author: 'Сергій', date: '2024-12-21', content: 'Ялинки - символ свята, але їхнє вирощування вимагає терпіння...', likes: 9, comments: 2, category: 'Дерева' }
    ];

    const discussionList = document.getElementById('discussion-list');
    const filterToggleBtn = document.getElementById('filter-toggle-btn');
    const filterOptions = document.getElementById('filter-options');
    const searchBtn = document.getElementById('search-btn');
    const searchInput = document.getElementById('search');
    const loadMoreBtn = document.getElementById('load-more-btn');
    const discussionsPerLoad = 3;
    let currentIndex = 0;
    let filteredDiscussions = discussions; // Створюємо змінну для відфільтрованих обговорень

    // Показати/сховати випадаючий список із фільтрами
    filterToggleBtn.addEventListener('click', () => {
        filterOptions.classList.toggle('visible');
    });

    // Закрити випадаючий список при натисканні поза ним
    document.addEventListener('click', (event) => {
        if (!filterToggleBtn.contains(event.target) && !filterOptions.contains(event.target)) {
            filterOptions.classList.remove('visible');
        }
    });

    // Функція для отримання вибраних категорій
    function getSelectedCategories() {
        const checkboxes = filterOptions.querySelectorAll('input[type="checkbox"]:checked');
        return Array.from(checkboxes).map(checkbox => checkbox.value);
    }

    // Функція для обрізки тексту до певної кількості слів
    function truncateText(text, wordLimit) {
        const words = text.split(' ');
        if (words.length <= wordLimit) {
            return text;
        }
        return words.slice(0, wordLimit).join(' ') + '...';
    }

    // Функція для завантаження обговорень
    function loadDiscussions(discussionsToLoad) {
        const fragment = document.createDocumentFragment();
        discussionsToLoad.forEach(disc => {
            const truncatedContent = truncateText(disc.content, 30);
            const discussionDiv = document.createElement('div');
            discussionDiv.classList.add('discussion');
            discussionDiv.innerHTML = `
                <div class="discussion-header">
                    <img src="${categories[disc.category]}" alt="${disc.category}" class="category-img">
                    <div>
                        <h3>${disc.title}</h3>
                        <p>Категорія: ${disc.category}</p>
                        <p>Автор: ${disc.author} | Дата: ${disc.date}</p>
                    </div>
                </div>
                <p>${truncatedContent}</p>
                <p>Лайки: ${disc.likes} | Коментарі: ${disc.comments}</p>
            `;
            fragment.appendChild(discussionDiv);
        });
        discussionList.appendChild(fragment);
    }

    // Завантаження обговорень з кнопкою "Завантажити ще"
    function loadMoreDiscussions() {
        const discussionsToLoad = filteredDiscussions.slice(currentIndex, currentIndex + discussionsPerLoad);
        loadDiscussions(discussionsToLoad);
        currentIndex += discussionsPerLoad;

        if (currentIndex >= filteredDiscussions.length) {
            loadMoreBtn.classList.add('hidden'); // Ховати кнопку, якщо всі обговорення завантажені
        }
    }

    // Функція для об'єднаної фільтрації
    function filterDiscussions() {
        const searchTerm = searchInput.value.toLowerCase();
        const selectedCategories = getSelectedCategories();

        filteredDiscussions = discussions.filter(disc => {
            const matchesCategory = selectedCategories.length === 0 || selectedCategories.includes(disc.category);
            const matchesSearch = disc.title.toLowerCase().includes(searchTerm) || disc.content.toLowerCase().includes(searchTerm);
            return matchesCategory && matchesSearch;
        });

        discussionList.innerHTML = '';
        currentIndex = 0; // Скидаємо індекс для завантаження
        loadDiscussions(filteredDiscussions.slice(0, discussionsPerLoad));
        currentIndex = discussionsPerLoad;

        if (filteredDiscussions.length > discussionsPerLoad) {
            loadMoreBtn.classList.remove('hidden');
        } else {
            loadMoreBtn.classList.add('hidden');
        }
    }

    // Обробники для фільтрації та кнопки "Завантажити ще"
    filterOptions.addEventListener('change', filterDiscussions);
    searchBtn.addEventListener('click', filterDiscussions);
    loadMoreBtn.addEventListener('click', loadMoreDiscussions);

    // Початкове завантаження перших трьох обговорень
    loadMoreDiscussions();
});
document.getElementById('create-topic-btn').addEventListener('click', () => {
            window.location.href = 'create-discussion';
        });

        </script>        
</body>
</html>
