{% extends 'base.html' %}
{% load static %}

{% block title %}Список тварин{% endblock %}

{% block extra_head %}
    <link rel="stylesheet" type="text/css" href="{% static 'api/stylespages.css' %}">
    <style>
        .search-container {
            margin-top: 120px;
        }
    </style>
{% endblock %}

{% block content %}
    <div class="search-container">
        <input type="text" id="catalog-search" placeholder="Пошук квітів, тварин, овочів...">
        <div id="search-results" class="search-results"></div>
    </div>
    
    <div class="card-container">
        <div class="items">
            {% for animal in animals %}
                <div class="card">
                    <img src="{{ animal.Image|default:'default-animal.jpg' }}" alt="{{ animal.common_name|default:'Невідома тварина' }}">
                    <div class="card-title">{{ animal.Name|default:"Невідома тварина" }}</div>
                    <a class="card-button" href="{{ animal.idAni }}/">Інформація</a>
                </div>
            {% endfor %}
        </div>
    </div>
{% endblock %}

{% block extra_scripts %}
    <script>
    document.addEventListener('DOMContentLoaded', () => {
            const searchInput = document.getElementById('catalog-search');
            const searchResults = document.getElementById('search-results');
            searchInput.addEventListener('input', function(e) {
                const query = this.value.trim();
                searchResults.innerHTML = '';
                
                if (query.length < 2) {
                    searchResults.style.display = 'none';
                    return;
                }
                // Виклик API для пошуку
                fetch(`/api/search/?query=${encodeURIComponent(query)}`)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`Помилка сервера: ${response.status}`);
                        }
                        return response.json();
                    })
                    .then(data => {
                        if (data && data.results && data.results.length > 0) {
                            data.results.forEach(result => {
                                const div = document.createElement('div');
                                div.className = 'search-result-item';
                                div.innerHTML = `
                                    <img src="${result.image_url}" alt="${result.name}">
                                    <div>
                                        <strong>${result.name}</strong>
                                        <div class="category-tag">${result.type}</div>
                                    </div>
                                `;
                                div.addEventListener('click', () => {
                                    window.location.href = result.url;
                                });
                                searchResults.appendChild(div);
                            });
                            searchResults.style.display = 'block';
                        } else {
                            searchResults.innerHTML = '<div class="search-result-item">Нічого не знайдено</div>';
                            searchResults.style.display = 'block';
                        }
                    })
                    .catch(error => {
                        console.error('Помилка при пошуку:', error);
                        searchResults.innerHTML = '<div class="search-result-item">Помилка при пошуку</div>';
                        searchResults.style.display = 'block';
                    });
            });
            // Приховуємо результати при кліку поза пошуком
            document.addEventListener('click', (e) => {
                if (!searchInput.contains(e.target) && !searchResults.contains(e.target)) {
                    searchResults.style.display = 'none';
                }
            });
            // Обробка клавіші Enter
            searchInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    const firstResult = searchResults.querySelector('.search-result-item');
                    if (firstResult && !firstResult.textContent.includes('Нічого')) {
                        window.location.href = firstResult.dataset.url;
                    }
                }
            });
        });
    </script>
{% endblock %}
