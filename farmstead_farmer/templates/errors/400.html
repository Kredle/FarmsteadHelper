<!DOCTYPE html>
<html lang="uk">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Помилка 400</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f0fff8; /* Змінений фон */
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            flex-direction: column;
        }

        .error-container {
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            text-align: center;
        }

        h1 {
            font-size: 48px;
            color: #dc3545;
        }

        p {
            font-size: 18px;
            margin: 10px 0;
        }

        .home-btn {
            display: inline-block;
            padding: 10px 20px;
            font-size: 16px;
            color: white;
            background-color: #3b9173; /* Колір кнопки */
            text-decoration: none;
            border-radius: 5px;
            margin-top: 15px;
            transition: background-color 0.3s;
        }

        .home-btn:hover {
            background-color: #4ab58f; /* Колір кнопки при наведенні */
        }

        .logo {
            width: 200px; /* Розмір лого */
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <img src="{% static 'logo.png' %}" alt="Лого" class="logo"> 
        <h1>Помилка 400</h1>
        <p>Помилка запиту. Синтаксична помилка або некоректні дані в запиті. Будь ласка, перевірте введену інформацію та спробуйте знову.</p>
        <a href="/" class="home-btn">Повернутися на головну</a>
    </div>
</body>
</html>
