{% load static %}
    <div class="line_top">
        <div class="logo">
            <img src="{% static 'logo.png' %}" alt="FarmsteadHelper Logo">
            <span>FarmsteadHelper</span>
        </div>
        <div class="hamburger" id="hamburger">
        <div></div>
        <div></div>
        <div></div>
    </div>
    <div class="side-menu" id="side-menu">
        <div class="side-menu-close">
            <button id="close-menu">&times;</button>
        </div>
        <a href="/">Головна</a>
        <a href="/catalog">Каталог</a>
        <a href="/forum">Форум</a>
        <a href="/map">Інтерактивна мапа</a>
        <a href="/calendar">Календар</a>
        <div class="auth-buttons">
            <div style="display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 10px;">
                <div class="notification-container" style="display: none;">{% include 'notifications/notifications.html' %}</div>
                <div id="side-menu-avatar"></div>
            </div>
            <div id="side-menu-auth" style="display: flex; flex-direction: column; width: 100%;">
                <a href="/login">Вхід</a>
                <a href="/register">Реєстрація</a>
            </div>
        </div>
    </div>
    <nav>
        <a href="/">Головна</a>
        <a href="/catalog">Каталог</a>
        <a href="/forum">Форум</a>
        <a href="/map">Інтерактивна мапа</a>
        <a href="/calendar">Календар</a>
    </nav>
    <div class="user-controls">
        <div class="notification-container" style="display: none;">{% include 'notifications/notifications.html' %}</div>
        <div class="auth">
            <div id="auth-profile" style="display: contents;">
                <img src="{% static 'loginlogo.png' %}" alt="Auth Icon" id="auth-icon">
                <div class="auth-menu">
                    <a href="/login">Вхід</a>
                    <a href="/register">Реєстрація</a>
                </div>
            </div>
        </div>
    </div>


    <script>

    var isAuthenticated = "{{ user.is_authenticated|yesno:'true,false' }}";

    document.addEventListener('DOMContentLoaded', () => {
        const token = localStorage.getItem('authToken');
        const authContainer = document.getElementById('auth-profile');
        const sideMenuAuth = document.getElementById('side-menu-auth');
        const sideMenuAvatar = document.getElementById('side-menu-avatar');

        if (token) {
            // Контейнер сповіщень залишаємо прихованим доки не завантажимо дані
            fetch('/api/user-data/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ token: token }),
            })
                .then(response => {
                    if (!response.ok) {
                        return response.json().then(err => {
                            throw new Error(`Помилка: ${err.detail || 'Невідома помилка'}`);
                        });
                    }
                    return response.json();
                })
                .then(data => {
                    const avatarUrl = data.avatarUrl ? decodeURIComponent(data.avatarUrl) : "{% static 'defaultlogo.png' %}";
                    authContainer.innerHTML = `
                        <img src="${avatarUrl}" alt="Avatar" class="user-avatar">
                        <div class="auth-menu">
                            <span>${data.username}</span>
                            <a href="/profile/${data.username}">Профіль</a>
                            <a href="/edit-profile/">Налаштування профілю</a>
                            <a href="#" id="logout-btn">Вихід</a>
                        </div>
                    `;

                    sideMenuAvatar.innerHTML = `<img src="${avatarUrl}" alt="Avatar" class="user-avatar" style="margin: 0;">`;
                    sideMenuAuth.innerHTML = `
                        <a href="/profile/${data.username}">Профіль</a>
                        <a href="/edit-profile">Налаштування профілю</a>
                        <a href="#" id="side-menu-logout">Вихід</a>
                     `;

                    // Тепер показуємо контейнер сповіщень після завантаження всіх даних
                    document.querySelectorAll('.notification-container').forEach(el => {
                        el.style.setProperty('display', 'flex', 'important');
                    });

                    // Показуємо весь user-controls контейнер з плавним переходом
                    const userControls = document.querySelector('.user-controls');
                    if (userControls) {
                        userControls.style.opacity = '1';
                    }

                    // Примусово оновлюємо сповіщення, бо ми щойно перемалювали DOM
                    if (typeof updateNotifications === 'function') {
                        updateNotifications();
                    }

                    document.getElementById('logout-btn').addEventListener('click', () => {
                        handleLogout();
                    });

                    document.getElementById('side-menu-logout').addEventListener('click', () => {
                        handleLogout();
                    });
                })
                .catch(error => {
                    console.error('Помилка при отриманні даних користувача:', error);
                    resetAuthState();
                });
        } else {
            resetAuthState();
        }

        function handleLogout() {
            fetch('/api/logout/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ token: token }),
            })
                .then(response => {
                    if (response.ok) {
                        localStorage.removeItem('authToken');
                        window.location.href = '/';
                    } else {
                        return response.json().then(err => {
                            throw new Error(`Помилка: ${err.detail || 'Невідома помилка'}`);
                        });
                    }
                })
                .catch(error => console.error('Помилка при виході:', error));
        }

        function resetAuthState() {
            authContainer.innerHTML = `
                <img src="{% static 'loginlogo.png' %}" alt="Auth Icon" id="auth-icon">
                <div class="auth-menu">
                    <a href="/login">Вхід</a>
                    <a href="/register">Реєстрація</a>
                </div>
            `;

            sideMenuAvatar.innerHTML = '';
            sideMenuAuth.innerHTML = `
                <a href="/login">Вхід</a>
                <a href="/register">Реєстрація</a>
            `;
            document.querySelectorAll('.notification-container').forEach(el => {
                el.style.display = 'none';
            });
            
            // Показуємо user-controls для неавторизованих користувачів
            const userControls = document.querySelector('.user-controls');
            if (userControls) {
                userControls.style.opacity = '1';
            }
        }
    });

    const hamburger = document.getElementById('hamburger');
    const sideMenu = document.getElementById('side-menu');
    const closeMenu = document.getElementById('close-menu');
    const nav = document.querySelector('nav');
    const auth = document.querySelector('.user-controls');

    hamburger.addEventListener('click', () => {
        sideMenu.style.right = '0';
    });

    closeMenu.addEventListener('click', () => {
        sideMenu.style.right = '-250px';
    });

    function checkMenuVisibility() {
        const isMobileDevice = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

        if (window.innerWidth < 900 || isMobileDevice) {
            nav.style.display = 'none';
            auth.style.display = 'none';
            hamburger.style.display = 'flex';
        } else {
            nav.style.display = 'flex';
            auth.style.display = 'flex';
            hamburger.style.display = 'none';
        }
    }

    checkMenuVisibility();
    window.addEventListener('resize', checkMenuVisibility);
    </script>
    </div>
