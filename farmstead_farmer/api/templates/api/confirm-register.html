<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FarmsteadHelper - Підтвердження реєстрації</title>
    <style>
        /* Загальні стилі */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Контейнер */
        .container {
            flex: 1;
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .container h1 {
            font-size: 24px;
            margin-bottom: 20px;
        }

        .container p {
            font-size: 16px;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .container a {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
            color: #fff;
            background-color: #333;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        .container a:hover {
            background-color: #555;
        }

        .error-message {
            color: red;
            margin-top: 10px;
        }

        /* Футер */
        footer {
            background-color: #333;
            color: #fff;
            text-align: center;
            padding: 10px 0;
            margin-top: auto;
        }

        footer p {
            margin: 5px 0;
        }

        footer a {
            color: #fff;
            text-decoration: underline;
            transition: color 0.3s;
        }

        footer a:hover {
            color: #ccc;
        }
        .input-field {
            padding-left: 10px;  /* Відступ зліва */
            padding-right: 10px; /* Відступ справа */
            box-sizing: border-box;  /* Включає padding в ширину */
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Введіть OTP код</h1>
        <p>На вашу електронну пошту було надіслано код підтвердження. Введіть його, щоб завершити реєстрацію.</p>
        <form id="otp-form">
            <input type="text" id="otp-code" placeholder="Введіть OTP код" required style="width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px;">
            <button type="submit" style="width: 100%; padding: 10px; background-color: #333; color: #fff; border: none; border-radius: 5px; font-size: 16px; cursor: pointer;">Підтвердити</button>
            <p id="error-message" class="error-message"></p>
        </form>
        <a href="/homepage">Повернутися на головну</a>
    </div>

    <footer>
        <p>&copy; 2024 FarmsteadHelper</p>
        <p>farmstead@example.com</p>
        <p><a href="/feedback/">Форма зворотного зв’язку</a></p>
    </footer>

    <script>
        document.getElementById('otp-form').addEventListener('submit', async (e) => {
        e.preventDefault();

        const otpCode = document.getElementById('otp-code').value;
        const email = localStorage.getItem('email');
        const lastname = localStorage.getItem('lastname');
        const firstname = localStorage.getItem('firstname');
        const username = localStorage.getItem('username');
        const password = localStorage.getItem('password');
        const repeatPassword = localStorage.getItem('repeat_password');  // Додаємо repeat_password
        const errorMessage = document.getElementById('error-message');

        if (!email) {
            errorMessage.textContent = 'Email не знайдено. Переконайтеся, що ви зареєстровані.';
            return;
        }

        try {
            // Перевіряємо OTP код
            const response = await fetch('/api/verify-otp/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ otp: otpCode, email: email }),
            });

            const result = await response.json();

            if (response.ok) {
                // Якщо OTP вірний, надсилаємо всі дані для реєстрації
                const registrationResponse = await fetch('/api/register/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: email,
                        lastname: lastname,
                        firstname: firstname,
                        username: username,
                        password: password,
                        repeat_password: repeatPassword  // Додаємо repeat_password
                    }),
                });

                const registrationResult = await registrationResponse.json();
                if (registrationResponse.ok) {
                    alert('Реєстрацію завершено успішно!');
                    window.location.href = '/login/';
                } else {
                    errorMessage.textContent = registrationResult.error || 'Помилка при завершенні реєстрації.';
                }
            } else {
                errorMessage.textContent = result.error || 'Невірний OTP код.';
            }
        } catch (err) {
            errorMessage.textContent = 'Помилка зв’язку з сервером.';
            console.error(err);
        }
    });
    </script>
</body>
</html>
