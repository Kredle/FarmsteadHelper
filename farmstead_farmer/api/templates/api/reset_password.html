<!DOCTYPE html>
<html lang="uk">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Відновлення паролю</title>
    <link rel="icon" href="{% static 'logo.png' %}" type="image/png">
    <style>
        /* Загальні стилі */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Контейнер сторінки */
        .container {
            flex: 1;
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .container h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 20px;
        }

        .container p {
            font-size: 14px;
            margin-bottom: 20px;
            text-align: center;
        }

        /* Форма */
        form {
            display: flex;
            flex-direction: column;
        }

        form input {
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        form button {
            padding: 10px;
            font-size: 16px;
            color: #fff;
            background-color: #333;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        form button:hover {
            background-color: #555;
        }

        /* Футер */
        footer {
            background-color: #333;
            color: #fff;
            text-align: center;
            padding: 10px 0;
            margin-top: auto;
        }

        footer p {
            margin: 5px 0;
        }

        footer a {
            color: #fff;
            text-decoration: underline;
            transition: color 0.3s;
        }

        footer a:hover {
            color: #ccc;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Відновлення паролю</h1>
        <p id="instructions">Введіть адресу електронної пошти, щоб отримати інструкції з відновлення паролю.</p>
        <form id="reset-password-form">
            <input type="email" id="email" placeholder="Ваш email" required>
            <input type="text" id="otp" placeholder="Код OTP" style="display: none;">
            <button type="submit">Надіслати</button>
        </form>
        <p id="error-message" style="color: red; display: none;"></p>
    </div>
    
    <script>
        document.getElementById('reset-password-form').addEventListener('submit', async function (event) {
    event.preventDefault();
    const email = document.getElementById('email').value;
    const otpField = document.getElementById('otp');
    const errorMessage = document.getElementById('error-message');
    const instructions = document.getElementById('instructions');

    if (otpField.style.display === 'none') {
        // Step 1: Check if user exists and send OTP
        try {
            const response = await fetch('/api/check-user-pass/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email }),
            });

            if (response.ok) {
                await fetch('/api/send-otp/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email }),
                });
                instructions.textContent = 'Код OTP надіслано на вашу електронну адресу. Введіть його нижче.';
                otpField.style.display = 'block';  // Show the OTP input field

                // Dynamically add the 'required' attribute when OTP field is visible
                otpField.setAttribute('required', 'true');
            } else {
                const errorData = await response.json();
                errorMessage.textContent = errorData.error || 'Сталася помилка. Спробуйте пізніше.';
                errorMessage.style.display = 'block';
            }
        } catch {
            errorMessage.textContent = 'Сталася помилка. Спробуйте пізніше.';
            errorMessage.style.display = 'block';
        }
    } else {
        // Step 2: Verify OTP
        const otp = otpField.value;
        try {
            const response = await fetch('/api/verify-otp/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, otp }),
            });

            if (response.ok) {
                window.location.href = `/new-password/?email=${encodeURIComponent(email)}`;
            } else {
                const errorData = await response.json();
                errorMessage.textContent = errorData.error || 'Невірний код OTP.';
                errorMessage.style.display = 'block';
            }
        } catch {
            errorMessage.textContent = 'Сталася помилка. Спробуйте пізніше.';
            errorMessage.style.display = 'block';
        }
    }
});
    </script>
    

    <footer>
        <style>
            body {
                margin: 0;
                font-family: Arial, sans-serif;
                background-color: #f5f5f5;
            }
    
            footer {
                background-color: #333;
                color: #fff;
                padding: 20px 10px;
                display: flex;
                flex-direction: column;
                align-items: center;
                text-align: center;
            }
    
            .legal-links {
                display: flex;
                justify-content: center;
                gap: 10px;
                margin-top: 10px;
            }
    
            .legal-links a {
                color: #fff;
                text-decoration: none;
                font-size: 14px;
            }
    
            .legal-links a:hover {
                text-decoration: underline;
            }
    
            .legal-links span {
                color: #fff;
                font-size: 14px;
            }
    
            .copyright {
                font-size: 14px;
                color: #ccc;
                margin-top: 20px;
            }
        </style>
    
        <div class="legal-links">
            <a href="https://drive.google.com/file/d/1kYJ7ulJFNFk_dDLPced_ToOEeX4Ocf4y/view?usp=sharing">Умови використання</a>
            <span>|</span>
            <a href="https://drive.google.com/file/d/1B56gHpLaAyReM2HP_MCrBmQKi1tTMROP/view?usp=sharing">Політика конфіденційності</a>
            <span>|</span>
            <a href="/contact-form">Форма зворотного зв’язку</a>
        </div>
        <div class="copyright">
            &copy; 2024 FarmsteadHelper. Усі права захищено.
        </div>
    </footer>
</body>
</html>
