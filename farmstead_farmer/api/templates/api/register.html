{% extends 'base.html' %}
{% load static %}

{% block title %}Реєстрація{% endblock %}

{% block extra_head %}
    <link rel="stylesheet" type="text/css" href="{% static 'api/stylesregister.css' %}">
{% endblock %}

{% block content %}
    <form id="registration-form" class="registration-form">
        <h2>Реєстрація</h2>

        <div class="form-group">
            <label for="lastname">Прізвище</label>
            <input type="text" id="lastname" name="lastname" placeholder="Введіть ваше прізвище" required>
        </div>

        <div class="form-group">
            <label for="firstname">Ім’я</label>
            <input type="text" id="firstname" name="firstname" placeholder="Введіть ваше ім’я" required>
        </div>

        <div class="form-group">
            <label for="username">Логін</label>
            <input type="text" id="username" name="username" placeholder="Введіть ваш логін" required>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Введіть ваш email" required>
        </div>

        <div class="form-group">
            <label for="password">Пароль</label>
            <input type="password" id="password" name="password" placeholder="Введіть ваш пароль" required>
        </div>

        <div class="form-group">
            <label for="repeat_password">Повторіть пароль</label>
            <input type="password" id="repeat_password" name="repeat_password" placeholder="Повторіть ваш пароль" required>
        </div>

        <div class="form-group-full checkbox-group">
            <input type="checkbox" id="agree-terms" name="agree-terms" required>
            <label for="agree-terms">Я згоден(-на) з <a href="{% static 'terms_of_use.pdf' %}" target="_blank">умовами використання</a> і <a href="{% static 'privacy_policy.pdf' %}" target="_blank">політикою конфіденційності</a>.</label>
        </div>

        <div class="form-group-full checkbox-group">
            <input type="checkbox" id="agree-data" name="agree-data" required>
            <label for="agree-data">Я надаю право на обробку моїх персональних даних.</label>
        </div>

        <p class="error-message" id="error-message"></p>

        <button type="submit">Зареєструватися</button>
        <p id="response-message" style="color: green; text-align: center;"></p>
    </form>

    <div id="customAlert" style="display: none;">
        <div id="customAlertBox">
            <p id="customAlertMessage"></p>
            <button onclick="closeAlert()">OK</button>
        </div>
    </div>
{% endblock %}

{% block footer %}{% endblock %}

{% block extra_scripts %}
    <script>
        document.getElementById('registration-form').addEventListener('submit', async (e) => {
            e.preventDefault();
    
            const email = document.getElementById('email').value;
            const lastname = document.getElementById('lastname').value;
            const firstname = document.getElementById('firstname').value;
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const repeatPassword = document.getElementById('repeat_password').value;
            const agreeTerms = document.getElementById('agree-terms').checked;
            const agreeData = document.getElementById('agree-data').checked;
            const errorMessage = document.getElementById('error-message');
    
            // Validate password and agreement checkboxes
            if (password.length < 8) {
                errorMessage.textContent = 'Пароль має містити не менше 8 символів.';
                return;
            }
    
            if (password !== repeatPassword) {
                errorMessage.textContent = 'Паролі не співпадають. Будь ласка, перевірте.';
                return;
            }
    
            if (!agreeTerms || !agreeData) {
                errorMessage.textContent = 'Ви повинні погодитися з умовами використання та обробкою персональних даних.';
                return;
            }
    
            errorMessage.textContent = ''; // Clear error message
    
            try {
                // Check if email is available
                const checkResponse = await fetch('/api/check-user/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email }),
                });
    
                const checkResult = await checkResponse.json();
    
                if (!checkResponse.ok) {
                    errorMessage.textContent = checkResult.error || 'Цей логін або email вже використовується.';
                    return; // Stop if email is already taken
                }
    
                // If email is available, send OTP
                const otpResponse = await fetch('/api/send-otp/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email }),
                });
    
                const otpResult = await otpResponse.json();
    
                if (!otpResponse.ok) {
                    throw new Error(otpResult.error || 'Помилка при відправці OTP.');
                }
    
                showAlert(otpResult.message || 'OTP успішно надіслано!');
    
                // Save data in localStorage
                localStorage.setItem('email', email);
                localStorage.setItem('lastname', lastname);
                localStorage.setItem('firstname', firstname);
                localStorage.setItem('username', username);
                localStorage.setItem('password', password);
                localStorage.setItem('repeat_password', repeatPassword);
    
                // Redirect to the OTP confirmation page
                window.location.href = '/confirm-register/';
    
            } catch (err) {
                console.error('Помилка:', err);
                errorMessage.textContent = 'Не вдалося завершити реєстрацію. Спробуйте знову.';
            }
        });
    </script>
    <script>
        function showAlert(message) {
            document.getElementById('customAlertMessage').textContent = message;
            document.getElementById('customAlert').style.display = 'flex';
        }
        
        function closeAlert() {
            document.getElementById('customAlert').style.display = 'none';
        }
    </script>
{% endblock %}
