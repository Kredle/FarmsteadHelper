<!DOCTYPE html>
<html lang="uk">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Встановлення нового паролю</title>
    <link rel="icon" href="{% static 'logo.png' %}" type="image/png">
    <link rel="stylesheet" type="text/css" href="{% static 'api/stylesapi.css' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'api/mainstyles.css' %}">
</head>
<body>
    <!-- Хедер -->
    <header>
    
    <div class="logo">
        <img src="{% static 'logo.png' %}" alt="FarmsteadHelper Logo">
        <span>FarmsteadHelper</span>
    </div>
    <div class="hamburger" id="hamburger">
        <div></div>
        <div></div>
        <div></div>
    </div>
    <div class="side-menu" id="side-menu">
        <div class="side-menu-close">
            <button id="close-menu">&times;</button>
        </div>
        <a href="/">Головна</a>
        <a href="/catalog">Каталог</a>
        <a href="/forum">Форум</a>
        <a href="/map">Інтерактивна мапа</a>
        <a href="/calendar">Календар</a>
        <div class="auth-buttons" id="side-menu-auth">
            <a href="/login">Вхід</a>
            <a href="/register">Реєстрація</a>
        </div>
    </div>
    <nav>
        <a href="/">Головна</a>
        <a href="/catalog">Каталог</a>
        <a href="/forum">Форум</a>
        <a href="/map">Інтерактивна мапа</a>
        <a href="/calendar">Календар</a>
    </nav>
    <div class="auth">
        <img src="{% static 'loginlogo.png' %}" alt="Auth Icon" id="auth-icon">
        <div class="auth-menu">
            <a href="/login">Вхід</a>
            <a href="/register">Реєстрація</a>
        </div>
    </div>
    
    
    <script>

    var isAuthenticated = "{{ user.is_authenticated|yesno:'true,false' }}";
    
    document.addEventListener('DOMContentLoaded', () => {
        const token = localStorage.getItem('authToken');
        const authContainer = document.querySelector('.auth');
        const sideMenuAuth = document.getElementById('side-menu-auth');
    
        if (token) {
            fetch('/api/user-data/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ token: token }),
            })
                .then(response => {
                    if (!response.ok) {
                        return response.json().then(err => {
                            throw new Error(`Помилка: ${err.detail || 'Невідома помилка'}`);
                        });
                    }
                    return response.json();
                })
                .then(data => {
                    const avatarUrl = data.avatarUrl ? decodeURIComponent(data.avatarUrl) : "{% static 'defaultlogo.png' %}";
                    authContainer.innerHTML = `
                        <img src="${avatarUrl}" alt="Avatar" class="user-avatar">
                        <div class="auth-menu">
                            <span>${data.username}</span>
                            <a href="/profile/${data.username}">Профіль</a>
                            <a href="/edit-profile/">Налаштування профілю</a>
                            <a href="#" id="logout-btn">Вихід</a>
                        </div>
                    `;
    
                    sideMenuAuth.innerHTML = `
                        <a href="/profile/${data.username}">Профіль</a>
                        <a href="/edit-profile">Налаштування профілю</a>
                        <a href="#" id="side-menu-logout">Вихід</a>
                    `;
    
                    document.getElementById('logout-btn').addEventListener('click', () => {
                        handleLogout();
                    });
    
                    document.getElementById('side-menu-logout').addEventListener('click', () => {
                        handleLogout();
                    });
                })
                .catch(error => {
                    console.error('Помилка при отриманні даних користувача:', error);
                    resetAuthState();
                });
        } else {
            resetAuthState();
        }
    
        function handleLogout() {
            fetch('/api/logout/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ token: token }),
            })
                .then(response => {
                    if (response.ok) {
                        localStorage.removeItem('authToken');
                        window.location.href = '/';
                    } else {
                        return response.json().then(err => {
                            throw new Error(`Помилка: ${err.detail || 'Невідома помилка'}`);
                        });
                    }
                })
                .catch(error => console.error('Помилка при виході:', error));
        }
    
        function resetAuthState() {
            authContainer.innerHTML = `
                <img src="{% static 'loginlogo.png' %}" alt="Auth Icon" id="auth-icon">
                <div class="auth-menu">
                    <a href="/login">Вхід</a>
                    <a href="/register">Реєстрація</a>
                </div>
            `;
    
            sideMenuAuth.innerHTML = `
                <a href="/login">Вхід</a>
                <a href="/register">Реєстрація</a>
            `;
        }
    });
    
    const hamburger = document.getElementById('hamburger');
    const sideMenu = document.getElementById('side-menu');
    const closeMenu = document.getElementById('close-menu');
    const nav = document.querySelector('nav');
    const auth = document.querySelector('.auth');
    
    hamburger.addEventListener('click', () => {
        sideMenu.style.right = '0';
    });
    
    closeMenu.addEventListener('click', () => {
        sideMenu.style.right = '-250px';
    });
    
    function checkMenuVisibility() {
        const isMobileDevice = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    
        if (window.innerWidth < 900 || isMobileDevice) {
            nav.style.display = 'none';
            auth.style.display = 'none';
            hamburger.style.display = 'flex';
        } else {
            nav.style.display = 'flex';
            auth.style.display = 'block';
            hamburger.style.display = 'none';
        }
    }
    
    checkMenuVisibility();
    window.addEventListener('resize', checkMenuVisibility);
    </script>
    </header>
    <div class="form-container">
        <h1>Встановлення нового паролю</h1>
        <form id="new-password-form">
            <input type="hidden" id="email" value="{{ request.GET.email }}">
            <div class="form-group-new">
                <label for="new_password">Новий пароль</label>
                <input type="password" id="new_password" required>
            </div>
            <div class="form-group-new">
                <label for="confirm_password">Підтвердьте пароль</label>
                <input type="password" id="confirm_password" required>
            </div>
            <button type="submit" class="submit-btn">Змінити пароль</button>
        </form>
        <p id="error-message" style="color: red; display: none;"></p>
    </div>
    <div id="loading" style="display: none;">Завантаження...</div>
    
    <script>
        document.getElementById('new-password-form').addEventListener('submit', async function (event) {
    event.preventDefault();
    
    const urlParams = new URLSearchParams(window.location.search);
    const email = decodeURIComponent(urlParams.get('email'));
    const newPassword = document.getElementById('new_password').value;
    const confirmPassword = document.getElementById('confirm_password').value;
    const errorMessage = document.getElementById('error-message');
    const loading = document.getElementById('loading');

    // Перевірка на співпадіння паролів
    if (!newPassword || !confirmPassword) {
        errorMessage.textContent = 'Будь ласка, заповніть обидва поля пароля.';
        errorMessage.style.display = 'block';
        return;
    }

    if (newPassword !== confirmPassword) {
        errorMessage.textContent = 'Паролі не співпадають.';
        errorMessage.style.display = 'block';
        return;
    }

    // Показуємо індикатор завантаження
    loading.style.display = 'block';

    try {
        // Відправляємо запит на зміну паролю
        const response = await fetch('/api/reset-password/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                email, 
                new_password: newPassword, 
                confirm_password: confirmPassword
            }),
        });

        // Ховаємо індикатор завантаження
        loading.style.display = 'none';

        // Перевірка на успішну відповідь
        if (response.ok) {
            alert('Пароль успішно змінено!');
            window.location.href = '/login/';  // Перенаправлення на сторінку входу
        } else {
            // Обробка помилки
            const errorData = await response.json();
            errorMessage.textContent = errorData.error || 'Сталася помилка. Спробуйте пізніше.';
            errorMessage.style.display = 'block';
        }
    } catch (error) {
        loading.style.display = 'none';
        errorMessage.textContent = 'Сталася помилка. Спробуйте пізніше.';
        errorMessage.style.display = 'block';
    }
});
    </script>    
</body>
</html>
