{% extends 'base.html' %}
{% load static %}

{% block title %}Вхід{% endblock %}

{% block extra_head %}
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <link rel="stylesheet" type="text/css" href="{% static 'api/styleslogin.css' %}">
{% endblock %}

{% block content %}
    <form id="login-form" class="login-form">
        <h2>Вхід</h2>

        <label for="username">Ім'я користувача</label>
        <input type="text" id="username" name="username" placeholder="Введіть ім'я користувача" required>

        <label for="password">Пароль</label>
        <input type="password" id="password" name="password" placeholder="Введіть ваш пароль" required>
        <div class="g-recaptcha" data-sitekey="6Lct-rEqAAAAAMHcmMqBfqsMKJA6PFYmvpGrH6nd" data-callback="enableSubmit"></div>
        <p class="error-message" id="error-message"></p>

        <button type="submit">Увійти</button>

        <div class="links">
            <p>Не маєте акаунта? <a href="/register">Зареєструватися</a></p>
            <p><a href="/reset-password/">Забули пароль?</a></p>
        </div>
    </form>
{% endblock %}

{% block footer %}{% endblock %}

{% block extra_scripts %}
    <script src="{% static 'api/loginscript.js' %}"></script>
<style>
    .g-recaptcha > div {
    display: inline-block;
  }

.g-recaptcha {
    display: flex;
    justify-content: center;
    margin: 0px 0;
  }
</style>
{% endblock %}
