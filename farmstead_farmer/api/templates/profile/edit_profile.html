<!DOCTYPE html>
<html lang="uk">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редагування профілю</title>
    <link rel="stylesheet" href="{% static 'profile/styles.css' %}">
    <script>
        window.onload = function () {
    const token = localStorage.getItem('authToken');
    const bioForm = document.getElementById('change-bio-form');
    const usernameForm = document.getElementById('change-username-form');
    const passwordForm = document.getElementById('change-password-form');
    const avatarForm = document.getElementById('change-avatar-form'); // Form for avatar upload
    const avatarImg = document.getElementById('avatar-img');
    const bioField = document.getElementById('bio');
    const usernameField = document.getElementById('new-username');

    if (token) {
        console.log('Завантаження даних користувача...');

        fetch('/api/user-data/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ token: token }),
        })
            .then(response => response.json())
            .then(data => {
                console.log("User data:", data);

                let avatarUrl = data.avatarUrl ? decodeURIComponent(data.avatarUrl) : "{% static 'defaultlogo.png' %}";

                avatarImg.src = avatarUrl;
                avatarImg.src = avatarImg.src.replace('/edit-profile', '');
                usernameField.value = data.username;
                bioField.value = data.bio || "";
            })
            .catch(error => {
                console.error('Помилка:', error);
                alert('Сталася помилка при отриманні даних користувача');
            });

        usernameForm.addEventListener('submit', function (event) {
            event.preventDefault();
            const newUsername = usernameField.value;

            if (!newUsername) {
                alert("Будь ласка, введіть нове ім'я користувача.");
                return;
            }

            fetch('/api/change-username/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    token: token,
                    username: newUsername
                }),
            })
                .then(response => response.json())
                .then(data => {
                    if (data.message) {
                        alert(data.message);
                        window.location.reload(); // Reload the page after successful update
                    } else {
                        alert('Помилка: ' + data.error);
                    }
                })
                .catch(error => {
                    console.error('Помилка:', error);
                    alert('Сталася помилка при оновленні імені користувача');
                });
        });

        bioForm.addEventListener('submit', function (event) {
            event.preventDefault();
            const newBio = bioField.value;

            if (!newBio) {
                alert("Будь ласка, введіть нову біографію.");
                return;
            }

            fetch('/api/change-bio/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    token: token,
                    bio: newBio
                }),
            })
                .then(response => response.json())
                .then(data => {
                    if (data.message) {
                        alert(data.message);
                        window.location.reload(); // Reload the page after successful update
                    } else {
                        alert('Помилка: ' + data.error);
                    }
                })
                .catch(error => {
                    console.error('Помилка:', error);
                    alert('Сталася помилка при оновленні біографії');
                });
        });

        passwordForm.addEventListener('submit', function (event) {
            event.preventDefault();
            const currentPassword = document.getElementById('current-password').value;
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            if (!currentPassword || !newPassword || !confirmPassword) {
                alert("Будь ласка, заповніть всі поля для зміни пароля.");
                return;
            }

            if (newPassword !== confirmPassword) {
                alert("Паролі не збігаються!");
                return;
            }

            if (newPassword.length < 8) {
                alert("Новий пароль повинен містити хоча б 8 символів.");
                return;
            }

            fetch('/api/change-password/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    token: token,
                    current_password: currentPassword,
                    new_password: newPassword,
                    confirm_password: confirmPassword
                }),
            })
                .then(response => response.json())
                .then(data => {
                    if (data.message) {
                        alert(data.message);
                        window.location.reload(); // Reload the page after successful update
                    } else {
                        alert('Помилка: ' + data.error);
                    }
                })
                .catch(error => {
                    console.error('Помилка:', error);
                    alert('Сталася помилка при зміні пароля');
                });
        });

        avatarForm.addEventListener('submit', function (event) {
        event.preventDefault();
        const formData = new FormData(avatarForm);
        formData.append('token', token);

        fetch('/api/upload-avatar/', {
            method: 'POST',
            body: formData,
        })
            .then(response => response.json())
            .then(data => {
                if (data.avatarUrl) {
                    avatarImg.src = data.avatarUrl;
                    alert('Аватар успішно оновлено!');
                    window.location.reload(); 
                } else {
                    window.location.reload(); 
                }
            })
            .catch(error => {
                console.error('Помилка:', error);
                alert('Сталася помилка при завантаженні аватара');
            });
    });

    } else {
        console.log('Користувач не залогінений або не має токену');
        window.location.href = '/login/';
    }
};
    </script>          
</head>
<body>
    

    
    <!-- Хедер -->
    <header>
        <style>
            body {
                margin: 0;
                font-family: Arial, sans-serif;
            }
    
            header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 10px 20px;
                background-color: #333;
                box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
                position: fixed;
                z-index: 1000; /* Забезпечує верхній шар */
                box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1); /* Тінь для краси */
                top: 0;
                left: 0;
                width: 98%;
            }
    
            .logo {
                display: flex;
                align-items: center;
            }
    
            .logo img {
                height: 60px;
                margin-right: 10px;
            }
    
            .logo span {
                font-size: 20px;
                font-weight: bold;
                color: #fff;
            }
    
            nav {
                display: flex;
                gap: 20px;
            }
    
            nav a {
                text-decoration: none;
                color: #fff;
                font-size: 16px;
                padding: 5px 10px;
                transition: background-color 0.3s, color 0.3s;
            }
    
            nav a:hover {
                background-color: #444;
                border-radius: 5px;
            }
    
            .auth {
                position: relative;
            }
    
            .auth img {
                width: 70px;
                height: 70px;
                border-radius: 50%;
                cursor: pointer;
            }
    
            .auth-menu {
                display: none;
                position: absolute;
                top: 50px;
                right: 0;
                background-color: #fff;
                border: 1px solid #ddd;
                border-radius: 5px;
                box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
                z-index: 1000;
            }
    
            .auth-menu a {
                display: block;
                padding: 10px;
                text-decoration: none;
                color: #333;
                font-size: 14px;
            }
    
            .auth-menu a:hover {
                background-color: #f4f4f4;
            }
    
            .auth:hover .auth-menu {
                display: block;
            }
    
            .hamburger {
                display: none;
                flex-direction: column;
                cursor: pointer;
            }
    
            .hamburger div {
                width: 25px;
                height: 3px;
                background-color: #fff;
                margin: 4px 0;
            }
    
            .side-menu {
                position: fixed;
                top: 0;
                right: -250px;
                width: 250px;
                height: 100%;
                background-color: #333;
                box-shadow: -2px 0 5px rgba(0, 0, 0, 0.2);
                transition: right 0.3s ease;
                display: flex;
                flex-direction: column;
                padding-top: 20px;
                z-index: 1000;
                overflow-y: auto; /* Додає вертикальну прокрутку */
                overflow-x: hidden; /* Забороняє горизонтальну прокрутку */
                scrollbar-width: thin; /* Тонкий скролбар для браузерів, які підтримують */
                scrollbar-color: #555 #333; /* Колір скролбару */
            }
    
            .side-menu a {
                text-decoration: none;
                color: #fff;
                font-size: 18px;
                padding: 15px 20px;
                transition: background-color 0.3s;
            }
    
            .side-menu a:hover {
                background-color: #444;
            }
    
            .side-menu-close {
                text-align: right;
                padding: 10px;
            }
    
            .side-menu-close button {
                background: none;
                border: none;
                color: #fff;
                font-size: 20px;
                cursor: pointer;
            }
    
            .side-menu .auth-buttons {
                margin-top: auto;
                padding: 20px;
            }
    
            .side-menu .auth-buttons a {
                display: block;
                text-align: center;
                padding: 10px;
                background-color: #444;
                color: #fff;
                border-radius: 5px;
                margin-bottom: 10px;
                text-decoration: none;
            }
    
            .side-menu .auth-buttons a:hover {
                background-color: #555;
            }
    
            @media (max-width: 768px) {
                nav,
                .auth {
                    display: none;
                }
    
                .hamburger {
                    display: flex;
                    margin-left: auto;
                }
            }
        </style>
    
    <div class="logo">
        <img src="{% static 'logo.png' %}" alt="FarmsteadHelper Logo">
        <span>FarmsteadHelper</span>
    </div>
    <div class="hamburger" id="hamburger">
        <div></div>
        <div></div>
        <div></div>
    </div>
    <div class="side-menu" id="side-menu">
        <div class="side-menu-close">
            <button id="close-menu">&times;</button>
        </div>
        <a href="/">Головна</a>
        <a href="/catalog">Каталог</a>
        <a href="/forum">Форум</a>
        <a href="/map">Інтерактивна мапа</a>
        <a href="/calendar">Календар</a>
        <div class="auth-buttons" id="side-menu-auth">
            <a href="/login">Вхід</a>
            <a href="/register">Реєстрація</a>
        </div>
    </div>
    <nav>
        <a href="/">Головна</a>
        <a href="/catalog">Каталог</a>
        <a href="/forum">Форум</a>
        <a href="/map">Інтерактивна мапа</a>
        <a href="/calendar">Календар</a>
    </nav>
    <div class="auth">
        <img src="{% static 'loginlogo.png' %}" alt="Auth Icon" id="auth-icon">
        <div class="auth-menu">
            <a href="/login">Вхід</a>
            <a href="/register">Реєстрація</a>
        </div>
    </div>
    
    
    <script>

    var isAuthenticated = "{{ user.is_authenticated|yesno:'true,false' }}";
    
    document.addEventListener('DOMContentLoaded', () => {
        const token = localStorage.getItem('authToken');
        const authContainer = document.querySelector('.auth');
        const sideMenuAuth = document.getElementById('side-menu-auth');
    
        if (token) {
            fetch('/api/user-data/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ token: token }),
            })
                .then(response => {
                    if (!response.ok) {
                        return response.json().then(err => {
                            throw new Error(`Помилка: ${err.detail || 'Невідома помилка'}`);
                        });
                    }
                    return response.json();
                })
                .then(data => {
                    const avatarUrl = data.avatarUrl ? decodeURIComponent(data.avatarUrl) : "{% static 'defaultlogo.png' %}";
                    authContainer.innerHTML = `
                        <img src="${avatarUrl}" alt="Avatar" class="user-avatar">
                        <div class="auth-menu">
                            <span>${data.username}</span>
                            <a href="/profile/${data.username}">Профіль</a>
                            <a href="/edit-profile/">Налаштування профілю</a>
                            <a href="#" id="logout-btn">Вихід</a>
                        </div>
                    `;
    
                    sideMenuAuth.innerHTML = `
                        <a href="/profile/${data.username}">Профіль</a>
                        <a href="/edit-profile">Налаштування профілю</a>
                        <a href="#" id="side-menu-logout">Вихід</a>
                    `;
    
                    document.getElementById('logout-btn').addEventListener('click', () => {
                        handleLogout();
                    });
    
                    document.getElementById('side-menu-logout').addEventListener('click', () => {
                        handleLogout();
                    });
                })
                .catch(error => {
                    console.error('Помилка при отриманні даних користувача:', error);
                    resetAuthState();
                });
        } else {
            resetAuthState();
        }
    
        function handleLogout() {
            fetch('/api/logout/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ token: token }),
            })
                .then(response => {
                    if (response.ok) {
                        localStorage.removeItem('authToken');
                        window.location.href = '/';
                    } else {
                        return response.json().then(err => {
                            throw new Error(`Помилка: ${err.detail || 'Невідома помилка'}`);
                        });
                    }
                })
                .catch(error => console.error('Помилка при виході:', error));
        }
    
        function resetAuthState() {
            authContainer.innerHTML = `
                <img src="{% static 'loginlogo.png' %}" alt="Auth Icon" id="auth-icon">
                <div class="auth-menu">
                    <a href="/login">Вхід</a>
                    <a href="/register">Реєстрація</a>
                </div>
            `;
    
            sideMenuAuth.innerHTML = `
                <a href="/login">Вхід</a>
                <a href="/register">Реєстрація</a>
            `;
        }
    });
    
    const hamburger = document.getElementById('hamburger');
    const sideMenu = document.getElementById('side-menu');
    const closeMenu = document.getElementById('close-menu');
    const nav = document.querySelector('nav');
    const auth = document.querySelector('.auth');
    
    hamburger.addEventListener('click', () => {
        sideMenu.style.right = '0';
    });
    
    closeMenu.addEventListener('click', () => {
        sideMenu.style.right = '-250px';
    });
    
    function checkMenuVisibility() {
        const isMobileDevice = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    
        if (window.innerWidth < 900 || isMobileDevice) {
            nav.style.display = 'none';
            auth.style.display = 'none';
            hamburger.style.display = 'flex';
        } else {
            nav.style.display = 'flex';
            auth.style.display = 'block';
            hamburger.style.display = 'none';
        }
    }
    
    checkMenuVisibility();
    window.addEventListener('resize', checkMenuVisibility);
    </script>
    </header>
    <div class="edit-profile-container">
        <h2>Редагувати профіль</h2>
        <p id="status-message"></p>

        <!-- User Profile Display -->
        <div class="profile-display">
            <h3>Ім'я користувача: <span id="username-display"></span></h3>
            <div class="avatar-container">
                <img id="avatar-img" src="" alt="Аватар" class="avatar-img">
                <form id="change-avatar-form" enctype="multipart/form-data">
                    <div class="form-group">
                        <label for="avatar-file">Оновити аватар</label>
                        <input type="file" id="avatar-file" name="avatar" accept="image/*" required>
                    </div>
                    <button type="submit">Завантажити аватар</button>
                </form>
            </div>
            <p id="bio-display"></p> <!-- Bio will be displayed here -->
        </div>

       <!-- Form to edit user profile -->
        <form id="change-username-form" enctype="application/json">
            <div class="form-group">
                <label for="new-username">Ім'я користувача</label>
                <input type="text" id="new-username" name="username" required>
            </div>
            <button type="submit">Зберегти зміни</button>
        </form>

        <!-- Form to edit biography -->
        <form id="change-bio-form" enctype="application/json">
            <div class="form-group">
                <label for="bio">Біографія</label>
                <textarea id="bio" name="bio"></textarea>
            </div>
            <button type="submit">Зберегти біографію</button>
        </form>


        <hr>

        <!-- Form to change password -->
        <h3>Змінити пароль</h3>
        <form id="change-password-form">
            <div class="form-group">
                <label for="current-password">Теперішній пароль</label>
                <input type="password" id="current-password" name="current_password" required>
            </div>
            <div class="form-group">
                <label for="new-password">Новий пароль</label>
                <input type="password" id="new-password" name="new_password" required>
            </div>
            <div class="form-group">
                <label for="confirm-password">Підтвердження нового пароля</label>
                <input type="password" id="confirm-password" name="confirm_password" required>
            </div>
            <button type="submit">Змінити пароль</button>
        </form>
    </div>
</body>
</html>
