<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма зворотного зв'язку</title>
    <link rel="icon" href="{% static 'logo.png' %}" type="image/png">
    <link rel="stylesheet" type="text/css" href="{% static 'api/mainstyles.css' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'api/stylesapi.css' %}">
    {% comment %} <style>


        form {
            background-color: white;
            max-width: 500px;
            width: 100%;
            margin: auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        label {
            font-weight: bold;
            margin-top: 10px;
            display: block;
        }
        input, textarea, button {
            width: calc(100% - 20px);
            margin-top: 5px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        textarea {
            resize: none;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #45a049;
        }
        #loading-spinner {
            display: none;  /* Спочатку прихована */
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);  /* Центруємо спінер */
            background-color: rgba(0, 0, 0, 0.5); /* Прозорий фон */
            padding: 10px;
            border-radius: 5px;
            z-index: 1000; /* Перекриває інші елементи */
        }
        #loading-spinner img {
            max-width: 100px;  /* Задайте потрібний розмір спінера */
        }
    </style> {% endcomment %}
</head>
<body>



    <!-- Хедер -->
    <header>
    <div class="logo">
        <img src="{% static 'logo.png' %}" alt="FarmsteadHelper Logo">
        <span>FarmsteadHelper</span>
    </div>
    <div class="hamburger" id="hamburger">
        <div></div>
        <div></div>
        <div></div>
    </div>
    <div class="side-menu" id="side-menu">
        <div class="side-menu-close">
            <button id="close-menu">&times;</button>
        </div>
        <a href="/">Головна</a>
        <a href="/catalog">Каталог</a>
        <a href="/forum">Форум</a>
        <a href="/map">Інтерактивна мапа</a>
        <a href="/calendar">Календар</a>
        <div class="auth-buttons" id="side-menu-auth">
            <a href="/login">Вхід</a>
            <a href="/register">Реєстрація</a>
        </div>
    </div>
    <nav>
        <a href="/">Головна</a>
        <a href="/catalog">Каталог</a>
        <a href="/forum">Форум</a>
        <a href="/map">Інтерактивна мапа</a>
        <a href="/calendar">Календар</a>
    </nav>
    <div class="auth">
        <img src="{% static 'loginlogo.png' %}" alt="Auth Icon" id="auth-icon">
        <div class="auth-menu">
            <a href="/login">Вхід</a>
            <a href="/register">Реєстрація</a>
        </div>
    </div>


    <script>

    var isAuthenticated = "{{ user.is_authenticated|yesno:'true,false' }}";

    document.addEventListener('DOMContentLoaded', () => {
        const token = localStorage.getItem('authToken');
        const authContainer = document.querySelector('.auth');
        const sideMenuAuth = document.getElementById('side-menu-auth');

        if (token) {
            fetch('/api/user-data/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ token: token }),
            })
                .then(response => {
                    if (!response.ok) {
                        return response.json().then(err => {
                            throw new Error(`Помилка: ${err.detail || 'Невідома помилка'}`);
                        });
                    }
                    return response.json();
                })
                .then(data => {
                    const avatarUrl = data.avatarUrl ? decodeURIComponent(data.avatarUrl) : "{% static 'defaultlogo.png' %}";
                    authContainer.innerHTML = `
                        <img src="${avatarUrl}" alt="Avatar" class="user-avatar">
                        <div class="auth-menu">
                            <span>${data.username}</span>
                            <a href="/profile/${data.username}">Профіль</a>
                            <a href="/edit-profile/">Налаштування профілю</a>
                            <a href="#" id="logout-btn">Вихід</a>
                        </div>
                    `;

                    sideMenuAuth.innerHTML = `
                        <img src="${avatarUrl}" alt="Avatar" class="user-avatar">
                        <a href="/profile/${data.username}">Профіль</a>
                        <a href="/edit-profile">Налаштування профілю</a>
                        <a href="#" id="side-menu-logout">Вихід</a>
                    `;

                    document.getElementById('logout-btn').addEventListener('click', () => {
                        handleLogout();
                    });

                    document.getElementById('side-menu-logout').addEventListener('click', () => {
                        handleLogout();
                    });
                })
                .catch(error => {
                    console.error('Помилка при отриманні даних користувача:', error);
                    resetAuthState();
                });
        } else {
            resetAuthState();
        }

        function handleLogout() {
            fetch('/api/logout/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ token: token }),
            })
                .then(response => {
                    if (response.ok) {
                        localStorage.removeItem('authToken');
                        window.location.href = '/';
                    } else {
                        return response.json().then(err => {
                            throw new Error(`Помилка: ${err.detail || 'Невідома помилка'}`);
                        });
                    }
                })
                .catch(error => console.error('Помилка при виході:', error));
        }

        function resetAuthState() {
            authContainer.innerHTML = `
                <img src="{% static 'loginlogo.png' %}" alt="Auth Icon" id="auth-icon">
                <div class="auth-menu">
                    <a href="/login">Вхід</a>
                    <a href="/register">Реєстрація</a>
                </div>
            `;

            sideMenuAuth.innerHTML = `
                <a href="/login">Вхід</a>
                <a href="/register">Реєстрація</a>
            `;
        }
    });

    const hamburger = document.getElementById('hamburger');
    const sideMenu = document.getElementById('side-menu');
    const closeMenu = document.getElementById('close-menu');
    const nav = document.querySelector('nav');
    const auth = document.querySelector('.auth');

    hamburger.addEventListener('click', () => {
        sideMenu.style.right = '0';
    });

    closeMenu.addEventListener('click', () => {
        sideMenu.style.right = '-250px';
    });

    function checkMenuVisibility() {
        const isMobileDevice = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

        if (window.innerWidth < 900 || isMobileDevice) {
            nav.style.display = 'none';
            auth.style.display = 'none';
            hamburger.style.display = 'flex';
        } else {
            nav.style.display = 'flex';
            auth.style.display = 'block';
            hamburger.style.display = 'none';
        }
    }

    checkMenuVisibility();
    window.addEventListener('resize', checkMenuVisibility);
    </script>
    </header>
    <main>
        <form class="feedback_form" id="feedback-form" method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <label for="name">Ваше ім'я:</label>
            <input type="text" id="name" name="name" placeholder="Введіть ваше ім'я" required>

            <label for="email">Ваша електронна пошта:</label>
            <input type="email" id="email" name="email" placeholder="Введіть вашу пошту" required>

            <label for="message">Ваше повідомлення:</label>
            <textarea id="message" name="message" rows="5" placeholder="Введіть ваше повідомлення" required></textarea>

            <div class="g-recaptcha" data-sitekey="6Lct-rEqAAAAAMHcmMqBfqsMKJA6PFYmvpGrH6nd" data-callback="enableSubmit"></div>
            <p id="captcha-warning" style="color: red; display: none;">Будь ласка, пройдіть reCAPTCHA!</p>

            <label for="file">Прикріпити файл (необов'язково):</label>
            <input type="file" id="file" name="file">

            <button type="submit">Надіслати</button>
        </form>

        <!-- Спінер -->
        <div id="loading-spinner">
            <img src="https://i.gifer.com/ZZ5H.gif" alt="loading">
        </div>
    </main>
    
<div id="customAlert" style="display: none;">
    <div id="customAlertBox">
        <p id="customAlertMessage"></p>
        <button onclick="closeAlert()">OK</button>
    </div>
</div>


    <script>
        function enableSubmit() {
            document.getElementById("captcha-warning").style.display = "none";
        }
    
        document.getElementById("feedback-form").addEventListener("submit", function(event) {
        event.preventDefault();

        const formData = new FormData(this);
        const recaptchaToken = grecaptcha.getResponse();

        if (!recaptchaToken) {
            document.getElementById("captcha-warning").style.display = "block";
            return;
        }

        formData.append("recaptcha", recaptchaToken);
        const submitButton = this.querySelector('button[type="submit"]');
        submitButton.disabled = true;

        document.getElementById("loading-spinner").style.display = "block";

        fetch("{% url 'feedback' %}", {
            method: "POST",
            body: formData,
            headers: {
                'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
            }
        })
        .then(response => response.json())
        .then(data => {
            showAlert(data.message);
            document.getElementById("feedback-form").reset();
            grecaptcha.reset();
        })
        .catch(error => {
            showAlert("Сталася помилка при надсиланні форми.");
            console.error(error);
        })
        .finally(() => {
            document.getElementById("loading-spinner").style.display = "none";
            submitButton.disabled = false;
        });
    });
    </script>
    
<script>
    function showAlert(message) {
        document.getElementById('customAlertMessage').textContent = message;
        document.getElementById('customAlert').style.display = 'flex';
    }
    
    function closeAlert() {
        document.getElementById('customAlert').style.display = 'none';
    }
</script>
</body>
</html>
