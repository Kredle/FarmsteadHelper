<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FarmStead Helper - Feedback Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            text-align: center;
            font-size: 24px;
        }
        footer {
            background-color: #4CAF50;
            color: white;
            text-align: center;
            padding: 10px 20px;
            margin-top: auto;
        }
        main {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        form {
            background-color: white;
            max-width: 500px;
            width: 100%;
            margin: auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        label {
            font-weight: bold;
            margin-top: 10px;
            display: block;
        }
        input, textarea, button {
            width: 100%;
            margin-top: 5px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        textarea {
            resize: none;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <header>FarmStead Helper</header>
    <main>
        <form id="feedback-form" method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            
            <label for="name">Ваше ім'я:</label>
            <input type="text" id="name" name="name" placeholder="Введіть ваше ім'я" required>

            <label for="email">Ваша електронна пошта:</label>
            <input type="email" id="email" name="email" placeholder="Введіть вашу пошту" required>

            <label for="message">Ваше повідомлення:</label>
            <textarea id="message" name="message" rows="5" placeholder="Введіть ваше повідомлення" required></textarea>

            <label for="file">Прикріпити файл (необов'язково):</label>
            <input type="file" id="file" name="file">

            <button type="submit">Надіслати</button>
        </form>
    </main>
    <footer>&copy; 2024 FarmStead Helper. Усі права захищені.</footer>

    <script>
        document.getElementById("feedback-form").addEventListener("submit", function(event) {
            event.preventDefault(); 

            const formData = new FormData(this);

            fetch("{% url 'feedback' %}", {
                method: "POST",
                body: formData,
                headers: {
                    'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
                }
            })
            .then(response => response.json())
            .then(data => {
                alert(data.message); 
            })
            .catch(error => {
                console.error("Error:", error);
                alert("Щось пішло не так!");
            });
        });
    </script>
</body>
</html>
