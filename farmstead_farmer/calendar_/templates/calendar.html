<div id="customAlert" style="display: none;">
    <div id="customAlertBox">
        <p id="customAlertMessage"></p>
        <button onclick="closeAlert()">OK</button>
    </div>
</div>


        <script>

        var isAuthenticated = "{{ user.is_authenticated|yesno:'true,false' }}";

        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('authToken');
            const authContainer = document.querySelector('.auth');
            const sideMenuAuth = document.getElementById('side-menu-auth');

            if (token) {
                fetch('/api/user-data/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ token: token }),
                })
                    .then(response => {
                        if (!response.ok) {
                            return response.json().then(err => {
                                throw new Error(`Помилка: ${err.detail || 'Невідома помилка'}`);
                            });
                        }
                        return response.json();
                    })
                    .then(data => {

                        const avatarUrl = data.avatarUrl ? decodeURIComponent(data.avatarUrl) : "{% static 'defaultlogo.png' %}";
                        authContainer.innerHTML = `
                            <img src="${avatarUrl}" alt="Avatar" class="user-avatar">
                            <div class="auth-menu">
                                <span>${data.username}</span>
                                <a href="/profile/${data.username}">Профіль</a>
                                <a href="/edit-profile/">Налаштування профілю</a>
                                <a href="#" id="logout-btn">Вихід</a>
                            </div>
                        `;

                        sideMenuAuth.innerHTML = `
                            <img src="${avatarUrl}" alt="Avatar" class="user-avatar">
                            <a href="/profile/${data.username}">Профіль</a>
                            <a href="/edit-profile">Налаштування профілю</a>
                            <a href="#" id="side-menu-logout">Вихід</a>
                        `;

                        document.getElementById('logout-btn').addEventListener('click', () => {
                            handleLogout();
                        });

                        document.getElementById('side-menu-logout').addEventListener('click', () => {
                            handleLogout();
                        });
                    })
                    .catch(error => {
                        console.error('Помилка при отриманні даних користувача:', error);
                        resetAuthState();
                    });
            } else {
                resetAuthState();
            }

            function handleLogout() {
                fetch('/api/logout/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ token: token }),
                })
                    .then(response => {
                        if (response.ok) {
                            localStorage.removeItem('authToken');
                            window.location.href = '/';
                        } else {
                            return response.json().then(err => {
                                throw new Error(`Помилка: ${err.detail || 'Невідома помилка'}`);
                            });
                        }
                    })
                    .catch(error => console.error('Помилка при виході:', error));
            }

            function resetAuthState() {
                authContainer.innerHTML = `
                    <img src="{% static 'loginlogo.png' %}" alt="Auth Icon" id="auth-icon">
                    <div class="auth-menu">
                        <a href="/login">Вхід</a>
                        <a href="/register">Реєстрація</a>
                    </div>
                `;

                sideMenuAuth.innerHTML = `
                    <a href="/login">Вхід</a>
                    <a href="/register">Реєстрація</a>
                `;
            }
        });

        const hamburger = document.getElementById('hamburger');
        const sideMenu = document.getElementById('side-menu');
        const closeMenu = document.getElementById('close-menu');
        const nav = document.querySelector('nav');
        const auth = document.querySelector('.auth');

        hamburger.addEventListener('click', () => {
            sideMenu.style.right = '0';
        });

        closeMenu.addEventListener('click', () => {
            sideMenu.style.right = '-250px';
        });

        function checkMenuVisibility() {
            const isMobileDevice = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

            if (window.innerWidth < 900 || isMobileDevice) {
                nav.style.display = 'none';
                auth.style.display = 'none';
                hamburger.style.display = 'flex';
            } else {
                nav.style.display = 'flex';
                auth.style.display = 'block';
                hamburger.style.display = 'none';
            }
        }

        checkMenuVisibility();
        window.addEventListener('resize', checkMenuVisibility);
    </script>

    <script>
        let eventData = [];
        let selectedEventTypes = [];
        let originalSorts = [];
        const eventTypes = {
            'Цвітіння': '#E82163',
            'Дозрівання': '#4D9EE5',
            'Садіння': '#6FC873',
            'Зрілість': '#208150',
            'Садіння квітки': '#B619D2',
            'Удобрення': '#FF9800',
            'Обрізка': '#5F554D',
        };

        function updateEventTypeFilters() {
            const filtersContainer = document.getElementById('event-filters');
            filtersContainer.innerHTML = '';

            const uniqueTypes = [...new Set(eventData.map(e => e.title))];

            uniqueTypes.forEach(type => {
                const filterItem = document.createElement('div');
                filterItem.className = 'filter-item';
                filterItem.innerHTML = `
                    <input
                        type="checkbox"
                        id="filter-${type}"
                        value="${type}"
                        ${selectedEventTypes.includes(type) ? 'checked' : ''}
                        onchange="toggleEventType('${type}')"
                    >
                    <label for="filter-${type}">${type}</label>
                `;
                filtersContainer.appendChild(filterItem);
            });
        }

        function toggleEventType(type) {
            const index = selectedEventTypes.indexOf(type);
            if (index === -1) {
                selectedEventTypes.push(type);
            } else {
                selectedEventTypes.splice(index, 1);
            }
            initializeCalendar();
        }

        async function fetchSorts() {
            const category = document.getElementById("category").value;
            if (!category) {
                document.getElementById("sorts-wrapper").style.display = 'none';
                return;
            }

            document.getElementById("sorts-wrapper").style.display = 'block';

            const response = await fetch('/api/get_sorts/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ category })
            });

            const data = await response.json();
            const sortSelect = document.getElementById("sorts");
            originalSorts = data;
            sortSelect.innerHTML = "";

            const defaultOption = document.createElement("option");
            defaultOption.value = "";
            defaultOption.textContent = "--Виберіть Сорт--";
            defaultOption.disabled = true;
            defaultOption.selected = true;
            sortSelect.appendChild(defaultOption);

            if (data.error) {
                showAlert(data.error);
                return;
            }

            data.forEach(sort => {
                const option = document.createElement("option");
                option.value = sort;
                option.textContent = sort;
                sortSelect.appendChild(option);
            });
        }

        function filterSorts() {
            const input = document.getElementById('search-sorts');
            const filter = input.value.toLowerCase();
            const sortSelect = document.getElementById('sorts');

            sortSelect.innerHTML = '<option value="" disabled selected>--Виберіть Сорт--</option>';

            originalSorts
                .filter(sort => sort.toLowerCase().includes(filter))
                .forEach(sort => {
                    const option = document.createElement("option");
                    option.value = sort;
                    option.textContent = sort;
                    sortSelect.appendChild(option);
                });
        }

        async function fetchSortDetails() {
            const category = document.getElementById("category").value;
            const sortName = document.getElementById("sorts").value;

            if (!sortName) return;

            const response = await fetch('/api/get_sort_detail', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ category, sort_name: sortName })
            });

            const data = await response.json();
            eventData = formatEventData(data);
            selectedEventTypes = [...new Set(eventData.map(e => e.title))];
            updateEventTypeFilters();
            initializeCalendar();
        }

        function formatEventData(data) {
            const events = [];
            const currentYear = new Date().getFullYear();

            function addYearIfMissing(dateString) {
                return dateString.length === 5 ? `${currentYear}-${dateString}` : dateString;
            }

            const eventTracker = {};

            const handlers = {
                'дерева': () => {
                    if (data.Scope_of_bloom_From && data.Scope_of_bloom_To) {
                        addEventIfUnique('Цвітіння', data.Scope_of_bloom_From, data.Scope_of_bloom_To);
                    }
                    if (data.Ripe_Time_From && data.Ripe_Time_To) {
                        addEventIfUnique('Дозрівання', data.Ripe_Time_From, data.Ripe_Time_To);
                    }
                    [1, 2].forEach(i => {
                        if (data[`Planting_time_From${i}`] && data[`Planting_time_To${i}`]) {
                            addEventIfUnique('Садіння', data[`Planting_time_From${i}`], data[`Planting_time_To${i}`]);
                        }
                    });
                    let i = 1;
                    while (data[`Cutting_time_From${i}`] && data[`Cutting_time_To${i}`]) {
                        addEventIfUnique('Обрізка', data[`Cutting_time_From${i}`], data[`Cutting_time_To${i}`]);
                        i++;
                    }
                    i = 1;
                    while (data[`Fertilizer_date_From1_${i}`] && data[`Fertilizer_date_To1_${i}`]) {
                        addEventIfUnique('Удобрення', data[`Fertilizer_date_From1_${i}`], data[`Fertilizer_date_To1_${i}`]);
                        i++;
                    }
                    i = 1;
                    while (data[`Fertilizer_date_From2_${i}`] && data[`Fertilizer_date_To2_${i}`]) {
                        addEventIfUnique('Удобрення', data[`Fertilizer_date_From2_${i}`], data[`Fertilizer_date_To2_${i}`]);
                        i++;
                    }
                },
                'овочі': () => {
                    [1, 2].forEach(i => {
                        if (data[`Plant_time_From${i}`] && data[`Plant_time_To${i}`]) {
                            addEventIfUnique('Садіння', data[`Plant_time_From${i}`], data[`Plant_time_To${i}`]);
                        }
                    });
                    [1, 2].forEach(i => {
                        if (data[`Ripe_time_From${i}`] && data[`Ripe_time_To${i}`]) {
                            addEventIfUnique('Зрілість', data[`Ripe_time_From${i}`], data[`Ripe_time_To${i}`]);
                        }
                    });
                    let i = 1;
                    while (data[`Fertilizer_date_From1_${i}`] && data[`Fertilizer_date_To1_${i}`]) {
                        addEventIfUnique('Удобрення', data[`Fertilizer_date_From1_${i}`], data[`Fertilizer_date_To1_${i}`]);
                        i++;
                    }
                    i = 1;
                    while (data[`Fertilizer_date_From2_${i}`] && data[`Fertilizer_date_To2_${i}`]) {
                        addEventIfUnique('Удобрення', data[`Fertilizer_date_From2_${i}`], data[`Fertilizer_date_To2_${i}`]);
                        i++;
                    }
                },
                'рослини': () => {
                    if (data.start_date && data.end_date) {
                        addEventIfUnique('Садіння квітки', data.start_date, data.end_date);
                    }
                }
            };

            function addEventIfUnique(title, from, to) {
                const start = addYearIfMissing(from);
                const end = addYearIfMissing(to);

                if (!eventTracker[start]) eventTracker[start] = {};
                if (!eventTracker[start][title]) {
                    events.push({
                        title,
                        start: start,
                        end: end,
                        color: eventTypes[title],
                        description: title
                    });
                    eventTracker[start][title] = true;
                }
            }

            if (handlers[document.getElementById("category").value]) {
                handlers[document.getElementById("category").value]();
            }

            return events;
        }

        function initializeCalendar() {
            const currentYear = new Date().getFullYear();
            const calendarContainer = document.getElementById('calendar');
            calendarContainer.innerHTML = '';

            const filteredEvents = eventData.filter(event =>
                selectedEventTypes.includes(event.title)
            );

            const legend = document.createElement('div');
            legend.id = 'legend';
            legend.style.display = 'none';
            calendarContainer.appendChild(legend);

            selectedEventTypes.forEach(eventTitle => {
                const legendItem = document.createElement('div');
                legend.style.display = 'block';
                legendItem.className = 'legend-item';
                legendItem.innerHTML = `
                    <div class="legend-color" style="background: ${eventTypes[eventTitle]}"></div>
                    <span>${eventTitle}</span>
                `;
                legend.appendChild(legendItem);
            });

            const yearView = document.createElement('div');
            yearView.className = 'fc-year-view';
            calendarContainer.appendChild(yearView);

            for (let month = 0; month < 12; month++) {
                const monthContainer = document.createElement('div');
                monthContainer.className = 'fc-month-container';

                const monthHeader = document.createElement('div');
                monthHeader.className = 'fc-header';
                monthHeader.textContent = moment().month(month).format('MMMM YYYY');
                monthContainer.appendChild(monthHeader);

                const dayGrid = document.createElement('div');
                dayGrid.className = 'fc-day-grid';
                monthContainer.appendChild(dayGrid);

                const daysInMonth = moment().month(month).daysInMonth();
                for (let day = 1; day <= daysInMonth; day++) {
                    const dayCell = document.createElement('div');
                    dayCell.className = 'fc-day';
                    dayCell.textContent = day;

                    const currentDate = moment().year(currentYear).month(month).date(day).startOf('day');
                    const dayEvents = filteredEvents.filter(event => {
                        const start = moment(event.start).startOf('day');
                        const end = moment(event.end).startOf('day');
                        return currentDate.isBetween(start, end, null, '[]');
                    });

                    let offset = 0;
                    const usedColors = new Set();
                    dayEvents.forEach((event) => {
                        if (!usedColors.has(event.color)) {
                            const stripe = document.createElement('div');
                            stripe.className = 'event-stripe';
                            stripe.style.backgroundColor = event.color;
                            stripe.style.bottom = `${offset * 5}px`;
                            dayCell.appendChild(stripe);
                            usedColors.add(event.color);
                            offset++;
                        }
                    });

                    dayGrid.appendChild(dayCell);
                }
                yearView.appendChild(monthContainer);
            }
        }

        $(document).ready(() => initializeCalendar());


    </script>
</head>

<body>
    <div class="calendar_choice">
        <label for="category">Виберіть категорію:</label>
        <select id="category" onchange="fetchSorts()">
            <option value="">-- Виберіть --</option>
            <option value="дерева">Дерева</option>
            <option value="овочі">Овочі</option>
            <option value="рослини">Квіти</option>


        </select>

        <div id="sorts-wrapper">
            <div class="search_container">
                <input type="text" id="search-sorts" placeholder="Пошук сортів..." onkeyup="filterSorts()">
            </div>
            <label for="sorts">Сорти:</label>
            <select id="sorts" onchange="fetchSortDetails()">
                <option value="">-- Спочатку виберіть категорію --</option>
            </select>
            <button id="filter-button">Показати фільтри</button>
            <div class="filters-container" style="display: none;">
                <div class="event-filters" id="event-filters"></div>
            </div>
        </div>


    </div>

    <div id="calendar"></div>
</body>

});
</script>
