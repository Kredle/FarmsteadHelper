<!DOCTYPE html>
<html lang="uk">
<head>
    {% load static %}
    <link rel="icon" href="{% static 'logo.png' %}" type="image/png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Календар</title>

    <!-- Add jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    
    <!-- Add Moment.js (required by FullCalendar v3) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.1/moment.min.js"></script>

    <!-- FullCalendar CSS and JS -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@3.2.0/dist/fullcalendar.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@3.2.0/dist/fullcalendar.min.js"></script>

    <!-- Ukrainian Localization for FullCalendar -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@3.2.0/dist/locale/uk.js"></script>

    <style>
        #calendar {
            max-width: 1200px;
            margin: 0 auto;
            font-size: 12px;
        }

        .fc-year-view {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .fc-month-container {
            border: 1px solid #ddd;
            padding: 10px;
            background-color: #f9f9f9;
        }

        .fc-month-container .fc-header {
            text-align: center;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .fc-month-container .fc-day-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
        }

        .fc-month-container .fc-day {
            text-align: center;
            padding: 5px;
            border: 1px solid #ddd;
            background-color: #fff;
            position: relative;
            min-height: 40px;
        }

        .event-stripe {
            height: 4px;
            width: 100%;
            position: absolute;
            left: 0;
        }

        #sorts-wrapper {
            display: none;
        }

        /* Новий стиль для легенди */
        #legend {
            margin: 20px auto;
            max-width: 1200px;
            padding: 15px;
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .legend-item {
            display: inline-flex;
            align-items: center;
            margin-right: 25px;
            margin-bottom: 10px;
        }

        .legend-color {
            width: 20px;
            height: 20px;
            margin-right: 8px;
            border: 1px solid #ddd;
        }
    </style>
    

    
    <!-- Хедер -->
    <header>
        <style>
            #category {
                margin-top: 100px; /* Верхній відступ 20 пікселів */
            }
            body {
                margin: 0;
                font-family: Arial, sans-serif;
            }
    
            header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 10px 20px;
                background-color: #333;
                box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
                position: fixed;
                z-index: 1000; /* Забезпечує верхній шар */
                box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1); /* Тінь для краси */
                top: 0;
                left: 0;
                width: 98%;
            }
    
            .logo {
                display: flex;
                align-items: center;
            }
    
            .logo img {
                height: 60px;
                margin-right: 10px;
            }
    
            .logo span {
                font-size: 20px;
                font-weight: bold;
                color: #fff;
            }
    
            nav {
                display: flex;
                gap: 20px;
            }
    
            nav a {
                text-decoration: none;
                color: #fff;
                font-size: 16px;
                padding: 5px 10px;
                transition: background-color 0.3s, color 0.3s;
            }
    
            nav a:hover {
                background-color: #444;
                border-radius: 5px;
            }
    
            .auth {
                position: relative;
            }
    
            .auth img {
                width: 70px;
                height: 70px;
                border-radius: 50%;
                cursor: pointer;
            }
    
            .auth-menu {
                display: none;
                position: absolute;
                top: 50px;
                right: 0;
                background-color: #fff;
                border: 1px solid #ddd;
                border-radius: 5px;
                box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
                z-index: 1000;
            }
    
            .auth-menu a {
                display: block;
                padding: 10px;
                text-decoration: none;
                color: #333;
                font-size: 14px;
            }
    
            .auth-menu a:hover {
                background-color: #f4f4f4;
            }
    
            .auth:hover .auth-menu {
                display: block;
            }
    
            .hamburger {
                display: none;
                flex-direction: column;
                cursor: pointer;
            }
    
            .hamburger div {
                width: 25px;
                height: 3px;
                background-color: #fff;
                margin: 4px 0;
            }
    
            .side-menu {
                position: fixed;
                top: 0;
                right: -250px;
                width: 250px;
                height: 100%;
                background-color: #333;
                box-shadow: -2px 0 5px rgba(0, 0, 0, 0.2);
                transition: right 0.3s ease;
                display: flex;
                flex-direction: column;
                padding-top: 20px;
                z-index: 1000;
                overflow-y: auto; /* Додає вертикальну прокрутку */
                overflow-x: hidden; /* Забороняє горизонтальну прокрутку */
                scrollbar-width: thin; /* Тонкий скролбар для браузерів, які підтримують */
                scrollbar-color: #555 #333; /* Колір скролбару */
            }
    
            .side-menu a {
                text-decoration: none;
                color: #fff;
                font-size: 18px;
                padding: 15px 20px;
                transition: background-color 0.3s;
            }
    
            .side-menu a:hover {
                background-color: #444;
            }
    
            .side-menu-close {
                text-align: right;
                padding: 10px;
            }
    
            .side-menu-close button {
                background: none;
                border: none;
                color: #fff;
                font-size: 20px;
                cursor: pointer;
            }
    
            .side-menu .auth-buttons {
                margin-top: auto;
                padding: 20px;
            }
    
            .side-menu .auth-buttons a {
                display: block;
                text-align: center;
                padding: 10px;
                background-color: #444;
                color: #fff;
                border-radius: 5px;
                margin-bottom: 10px;
                text-decoration: none;
            }
    
            .side-menu .auth-buttons a:hover {
                background-color: #555;
            }
    
            @media (max-width: 768px) {
                nav,
                .auth {
                    display: none;
                }
    
                .hamburger {
                    display: flex;
                    margin-left: auto;
                }
            }

            
        </style>

    <div class="auth">
        <img src="{% static 'loginlogo.png' %}" alt="Auth Icon" id="auth-icon">
        <div class="auth-menu">
            <a href="/login">Вхід</a>
            <a href="/register">Реєстрація</a>
        </div>
    </div>
    
    
    <script>

    var isAuthenticated = "{{ user.is_authenticated|yesno:'true,false' }}";
    
    document.addEventListener('DOMContentLoaded', () => {
        const token = localStorage.getItem('authToken');
        const authContainer = document.querySelector('.auth');
        const sideMenuAuth = document.getElementById('side-menu-auth');
    
        if (token) {
            fetch('/api/user-data/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ token: token }),
            })
                .then(response => {
                    if (!response.ok) {
                        return response.json().then(err => {
                            throw new Error(`Помилка: ${err.detail || 'Невідома помилка'}`);
                        });
                    }
                    return response.json();
                })
                .then(data => {
                    const avatarUrl = data.avatarUrl ? decodeURIComponent(data.avatarUrl) : "{% static 'defaultlogo.png' %}";
                    authContainer.innerHTML = `
                        <img src="${avatarUrl}" alt="Avatar" class="user-avatar">
                        <div class="auth-menu">
                            <span>${data.username}</span>
                            <a href="/profile/${data.username}">Профіль</a>
                            <a href="/edit-profile/">Налаштування профілю</a>
                            <a href="#" id="logout-btn">Вихід</a>
                        </div>
                    `;
    
                    sideMenuAuth.innerHTML = `
                        <a href="/profile/${data.username}">Профіль</a>
                        <a href="/edit-profile">Налаштування профілю</a>
                        <a href="#" id="side-menu-logout">Вихід</a>
                    `;
    
                    document.getElementById('logout-btn').addEventListener('click', () => {
                        handleLogout();
                    });
    
                    document.getElementById('side-menu-logout').addEventListener('click', () => {
                        handleLogout();
                    });
                })
                .catch(error => {
                    console.error('Помилка при отриманні даних користувача:', error);
                    resetAuthState();
                });
        } else {
            resetAuthState();
        }
    
        function handleLogout() {
            fetch('/api/logout/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ token: token }),
            })
                .then(response => {
                    if (response.ok) {
                        localStorage.removeItem('authToken');
                        window.location.href = '/';
                    } else {
                        return response.json().then(err => {
                            throw new Error(`Помилка: ${err.detail || 'Невідома помилка'}`);
                        });
                    }
                })
                .catch(error => console.error('Помилка при виході:', error));
        }
    
        function resetAuthState() {
            authContainer.innerHTML = `
                <img src="{% static 'loginlogo.png' %}" alt="Auth Icon" id="auth-icon">
                <div class="auth-menu">
                    <a href="/login">Вхід</a>
                    <a href="/register">Реєстрація</a>
                </div>
            `;
    
            sideMenuAuth.innerHTML = `
                <a href="/login">Вхід</a>
                <a href="/register">Реєстрація</a>
            `;
        }
    });
    
    const hamburger = document.getElementById('hamburger');
    const sideMenu = document.getElementById('side-menu');
    const closeMenu = document.getElementById('close-menu');
    const nav = document.querySelector('nav');
    const auth = document.querySelector('.auth');
    
    hamburger.addEventListener('click', () => {
        sideMenu.style.right = '0';
    });
    
    closeMenu.addEventListener('click', () => {
        sideMenu.style.right = '-250px';
    });
    
    function checkMenuVisibility() {
        const isMobileDevice = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    
        if (window.innerWidth < 900 || isMobileDevice) {
            nav.style.display = 'none';
            auth.style.display = 'none';
            hamburger.style.display = 'flex';
        } else {
            nav.style.display = 'flex';
            auth.style.display = 'block';
            hamburger.style.display = 'none';
        }
    }
    
    checkMenuVisibility();
    window.addEventListener('resize', checkMenuVisibility);
    </script>
    </header>

    <script>
        let eventData = [];
        const eventTypes = {
            'Цвітіння': '#D50000',  // Насичений червоний  
            'Дозрівання': '#2962FF', // Яскравий синій  
            'Посів': '#4CAF50',  // Яскравий зелений (замість оранжевого)  
            'Зрілість': '#2E7D32', // Темно-зелений  
            'Садіння рослини': '#8E24AA', // Глибокий фіолетовий  
            'Удобрення': '#FF6D00', // Яскравий оранжевий  
            'Обрізка': '#212121', // Темний графітовий (майже чорний)  
        };





    
        async function fetchSorts() {
            const category = document.getElementById("category").value;
            if (!category) {
                document.getElementById("sorts-wrapper").style.display = 'none';
                return;
            }
    
            document.getElementById("sorts-wrapper").style.display = 'block';
    
            const response = await fetch('/api/get_sorts/', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ category })
            });
    
            const data = await response.json();
            const sortSelect = document.getElementById("sorts");
            sortSelect.innerHTML = "";
    
            if (data.error) {
                alert(data.error);
                return;
            }
    
            data.forEach(sort => {
                const option = document.createElement("option");
                option.value = sort;
                option.textContent = sort;
                sortSelect.appendChild(option);
            });
        }
    
        async function fetchSortDetails() {
            const category = document.getElementById("category").value;
            const sortName = document.getElementById("sorts").value;
    
            if (!sortName) return;
    
            const response = await fetch('/api/get_sort_detail', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ category, sort_name: sortName })
            });
    
            const data = await response.json();
            eventData = formatEventData(data);
            initializeCalendar();
        }
    
        function formatEventData(data) {
            const events = [];
            const currentYear = new Date().getFullYear();

            function addYearIfMissing(dateString) {
                return dateString.length === 5 ? `${currentYear}-${dateString}` : dateString;
            }

            // Create a map to track existing events by date and type
            const eventTracker = {};

            // Обробка подій
            const handlers = {
                'дерева': () => {
                    // Цвітіння
                    if (data.Scope_of_bloom_From && data.Scope_of_bloom_To) {
                        addEventIfUnique('Цвітіння', data.Scope_of_bloom_From, data.Scope_of_bloom_To);
                    }
                    // Дозрівання
                    if (data.Ripe_Time_From && data.Ripe_Time_To) {
                        addEventIfUnique('Дозрівання', data.Ripe_Time_From, data.Ripe_Time_To);
                    }

                    // Садіння
                    [1, 2].forEach(i => {
                        if (data[`Planting_time_From${i}`] && data[`Planting_time_To${i}`]) {
                            addEventIfUnique('Посів', data[`Planting_time_From${i}`], data[`Planting_time_To${i}`]);
                        }
                    });

                    // Обрізка (виводимо всі елементи, а не тільки два)
                    let i = 1;
                    while (data[`Cutting_time_From${i}`] && data[`Cutting_time_To${i}`]) {
                        addEventIfUnique('Обрізка', data[`Cutting_time_From${i}`], data[`Cutting_time_To${i}`]);
                        i++;
                    }

                    // Удобрення (виводимо всі елементи, а не тільки два)
                    i = 1;
                    while (data[`Fertilizer_date_From1_${i}`] && data[`Fertilizer_date_To1_${i}`]) {
                        addEventIfUnique('Удобрення', data[`Fertilizer_date_From1_${i}`], data[`Fertilizer_date_To1_${i}`]);
                        i++;
                    }
                    i = 1;
                    while (data[`Fertilizer_date_From2_${i}`] && data[`Fertilizer_date_To2_${i}`]) {
                        addEventIfUnique('Удобрення', data[`Fertilizer_date_From2_${i}`], data[`Fertilizer_date_To2_${i}`]);
                        i++;
                    }
                },
                'овочі': () => {
                    // Посів
                    [1, 2].forEach(i => {
                        if (data[`Plant_time_From${i}`] && data[`Plant_time_To${i}`]) {
                            addEventIfUnique('Посів', data[`Plant_time_From${i}`], data[`Plant_time_To${i}`]);
                        }
                    });
                    // Зрілість
                    [1, 2].forEach(i => {
                        if (data[`Ripe_time_From${i}`] && data[`Ripe_time_To${i}`]) {
                            addEventIfUnique('Зрілість', data[`Ripe_time_From${i}`], data[`Ripe_time_To${i}`]);
                        }
                    });
                    // Удобрення (виводимо всі елементи, а не тільки два)
                    let i = 1;
                    while (data[`Fertilizer_date_From1_${i}`] && data[`Fertilizer_date_To1_${i}`]) {
                        addEventIfUnique('Удобрення', data[`Fertilizer_date_From1_${i}`], data[`Fertilizer_date_To1_${i}`]);
                        i++;
                    }
                    i = 1;
                    while (data[`Fertilizer_date_From2_${i}`] && data[`Fertilizer_date_To2_${i}`]) {
                        addEventIfUnique('Удобрення', data[`Fertilizer_date_From2_${i}`], data[`Fertilizer_date_To2_${i}`]);
                        i++;
                    }
                },
                'рослини': () => {
                    if (data.start_date && data.end_date) {
                        addEventIfUnique('Садіння рослини', data.start_date, data.end_date);
                    }
                }
            };

            function addEventIfUnique(title, from, to) {
                const start = addYearIfMissing(from);
                const end = addYearIfMissing(to);

                // Check if event already exists for this date and type
                if (!eventTracker[start]) {
                    eventTracker[start] = {};
                }

                if (!eventTracker[start][title]) {
                    // Add the event only if it's not already added for this date
                    events.push(createEvent(title, start, end));
                    eventTracker[start][title] = true; // Mark as added
                }
            }

            function createEvent(title, from, to) {
                return {
                    title,
                    start: from,
                    end: to,
                    color: eventTypes[title],
                    description: title
                };
            }

            if (handlers[document.getElementById("category").value]) {
                handlers[document.getElementById("category").value]();
            }

            return events;
        }

        function initializeCalendar() {
    const currentYear = new Date().getFullYear();
    const calendarContainer = document.getElementById('calendar');
    calendarContainer.innerHTML = '';

    // Додаємо легенду
    const legend = document.createElement('div');
    legend.id = 'legend';
    calendarContainer.appendChild(legend);

    // Генеруємо унікальні кольори для легенди
    const uniqueEvents = [...new Set(eventData.map(e => e.title))];
    uniqueEvents.forEach(eventTitle => {
        const legendItem = document.createElement('div');
        legendItem.className = 'legend-item';
        legendItem.innerHTML = `
            <div class="legend-color" style="background: ${eventTypes[eventTitle]}"></div>
            <span>${eventTitle}</span>
        `;
        legend.appendChild(legendItem);
    });

    // Створення сітки календаря
    const yearView = document.createElement('div');
    yearView.className = 'fc-year-view';
    calendarContainer.appendChild(yearView);

    // Для кожного місяця
    for (let month = 0; month < 12; month++) {
        const monthContainer = document.createElement('div');
        monthContainer.className = 'fc-month-container';

        const monthHeader = document.createElement('div');
        monthHeader.className = 'fc-header';
        monthHeader.textContent = moment().month(month).format('MMMM YYYY');
        monthContainer.appendChild(monthHeader);

        const dayGrid = document.createElement('div');
        dayGrid.className = 'fc-day-grid';
        monthContainer.appendChild(dayGrid);

        const daysInMonth = moment().month(month).daysInMonth();
        for (let day = 1; day <= daysInMonth; day++) {
            const dayCell = document.createElement('div');
            dayCell.className = 'fc-day';
            dayCell.textContent = day;

            const currentDate = moment().year(currentYear).month(month).date(day).startOf('day');
            const dayEvents = eventData.filter(event => {
                const start = moment(event.start).startOf('day');
                const end = moment(event.end).startOf('day');
                return currentDate.isBetween(start, end, null, '[]');
            });

            // Перевіряємо, які кольори вже використані для цього дня
            const usedColors = new Set();
            let offset = 0;

            dayEvents.forEach((event) => {
                if (!usedColors.has(event.color)) { // Якщо цього кольору ще немає в цей день
                    const stripe = document.createElement('div');
                    stripe.className = 'event-stripe';
                    stripe.style.backgroundColor = event.color;
                    stripe.style.bottom = `${offset * 5}px`;
                    dayCell.appendChild(stripe);
                    usedColors.add(event.color); // Запам'ятовуємо, що цей колір уже є
                    offset++;
                }
            });

            dayGrid.appendChild(dayCell);
        }
        yearView.appendChild(monthContainer);
    }
}


        $(document).ready(() => initializeCalendar());

    </script>
    
</head>
<body>
