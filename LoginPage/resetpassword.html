<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FarmsteadHelper - Відновлення паролю</title>
    <style>
        /* Загальні стилі */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Контейнер сторінки */
        .container {
            flex: 1;
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .container h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 20px;
        }

        .container p {
            font-size: 14px;
            margin-bottom: 20px;
            text-align: center;
        }

        /* Форма */
        form {
            display: flex;
            flex-direction: column;
        }

        form input {
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        form button {
            padding: 10px;
            font-size: 16px;
            color: #fff;
            background-color: #333;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        form button:hover {
            background-color: #555;
        }

        /* Футер */
        footer {
            background-color: #333;
            color: #fff;
            text-align: center;
            padding: 10px 0;
            margin-top: auto;
        }

        footer p {
            margin: 5px 0;
        }

        footer a {
            color: #fff;
            text-decoration: underline;
            transition: color 0.3s;
        }

        footer a:hover {
            color: #ccc;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Відновлення паролю</h1>
        <p>Введіть адресу електронної пошти, щоб отримати інструкції з відновлення паролю.</p>
        <form id="reset-password-form">
            <input type="email" name="email" placeholder="Ваш email" required>
            <button type="submit">Надіслати</button>
        </form>
    </div>

    <footer>
        <p>&copy; 2024 FarmsteadHelper</p>
        <p>farmstead@example.com</p>
        <p><a href="/feedbackform.html">Форма зворотного зв’язку</a></p>
    </footer>

    <script>
        // Форма відправляє запит через API
        document.getElementById('reset-password-form').addEventListener('submit', async function (event) {
            event.preventDefault();
            const email = event.target.email.value;

            try {
                const response = await fetch('https://api.farmsteadhelper.com/reset-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email }),
                });

                if (response.ok) {
                    alert('Інструкції для відновлення паролю надіслані на ваш email.');
                } else {
                    alert('Помилка: Перевірте правильність введеної адреси.');
                }
            } catch (error) {
                alert('Сталася помилка. Спробуйте пізніше.');
            }
        });
    </script>
</body>
</html>
