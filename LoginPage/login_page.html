<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вхід</title>
    <link rel="stylesheet" href="styleslogin.css">
</head>
<body>
    <form id="login-form" class="login-form">
        <h2>Вхід</h2>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Введіть ваш email" required>

        <label for="password">Пароль</label>
        <input type="password" id="password" name="password" placeholder="Введіть ваш пароль" required>

        <p class="error-message" id="error-message"></p>

        <button type="submit">Увійти</button>

        <div class="links">
            <p>Не маєте акаунта? <a href="/register">Зареєструватися</a></p>
            <p><a href="/forgot-password">Забули пароль?</a></p>
        </div>
    </form>

    <script src="loginscript.js"></script>
</body>
</html>
